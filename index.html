{ id:"m4", color:"teal", icon:"grid", title:"Il lessico UI", tag:"Vocabolario", sub:"Componenti, verbi del mestiere, falsi amici e aggettivi per il feedback.",
  lessons:[
  { id:"m4l1", h:"I componenti dell'interfaccia", min:8,
    tip:"Impara i nomi dei componenti **guardando il componente**, non la traduzione: forma + parola si ricordano meglio insieme (*dual coding*). Gli sviluppatori usano proprio questi nomi.",
    vocab:[["toggle / switch","interruttore on/off"],["checkbox","casella: più scelte possibili"],["radio button","una sola scelta tra tante"],["dropdown","menu a tendina"],["modal","finestra sopra la pagina, blocca il resto"],["toast","messaggio breve che appare e sparisce"],["tooltip","fumetto di aiuto su un elemento"],["tab bar","barra di schede in basso"],["breadcrumb","percorso: Home › Shop › Shoes"]],
    extra:"I verbi giusti: *==tap== a button* (mobile), *==click== a link* (desktop), *==check== a box*, *==toggle== a switch*, *==swipe== a card*, *==drag== a slider*.",
    trap:["Flag the option.","Check the box."],
    q:[
    {t:"ui",k:"toggle",p:"Come si chiama questo componente?",o:["checkbox","toggle","slider"],a:1,x:"*Toggle* (o *switch*): on/off immediato."},
    {t:"ui",k:"checkbox",p:"E questo?",o:["checkbox","radio button","toggle"],a:0,x:"*Checkbox*: puoi spuntarne più di una."},
    {t:"ui",k:"radio",p:"Una sola scelta possibile:",o:["checkboxes","radio buttons","dropdown"],a:1,x:"*Radio buttons*: una sola opzione attiva."},
    {t:"ui",k:"toast",p:"Il messaggio in basso è un…",o:["modal","tooltip","toast"],a:2,x:"*Toast*: breve, non blocca, sparisce da solo."},
    {t:"ui",k:"dropdown",p:"Come si chiama?",o:["dropdown","breadcrumb","tab bar"],a:0,x:"*Dropdown* (o *select*)."},
    {t:"ui",k:"breadcrumb",p:"Il percorso in alto è un…",o:["breadcrumb","stepper","pagination"],a:0,x:"*Breadcrumb*: le briciole di pane di Pollicino."},
    {t:"ui",k:"modal",p:"La finestra al centro è un…",o:["toast","modal","card"],a:1,x:"*Modal* (o *dialog*): blocca la pagina finché non scegli."},
    {t:"ui",k:"tooltip",p:"Il fumetto nero è un…",o:["badge","toast","tooltip"],a:2,x:"*Tooltip*: aiuto contestuale."},
    {t:"ui",k:"tabbar",p:"La barra in basso è una…",o:["tab bar","navigation drawer","toolbar"],a:0,x:"*Tab bar*: le sezioni principali dell'app."},
    {t:"choice",p:"“Flagga l'opzione” in inglese:",o:["Flag the option.","Check the box.","Flagger the box."],a:1,x:"In inglese una casella si *check* (UK anche *tick*)."}]},
  { id:"m4l2", h:"Phrasal verbs del designer", min:8,
    tip:"I phrasal verbs sono **verbo + particella**, e la particella cambia tutto: *roll out* = rilasciare gradualmente, *figure out* = capire. Imparali **dentro una frase intera** (*chunk*), mai da soli.",
    vocab:[["roll out","rilasciare (gradualmente)"],["come up with","inventare, proporre un'idea"],["figure out","capire, risolvere"],["set up","configurare, organizzare"],["follow up","ricontattare, dare seguito"],["sign off on","approvare formalmente"],["ship","rilasciare in produzione"],["iterate","fare una versione migliorata"]],
    extra:"Con un pronome la particella va dopo: *figure ==it out==*, *set ==it up==*, mai *figure out it*.",
    trap:["I'll follow you up by email.","I'll follow up by email."],
    q:[
    {t:"match",p:"Abbina il phrasal verb al significato.",pairs:[["roll out","rilasciare gradualmente"],["figure out","capire, risolvere"],["come up with","proporre un'idea"],["sign off on","approvare"]],x:"Imparali nella frase: *We rolled out the new nav.*"},
    {t:"choice",p:"We need to ___ a better name for this feature.",o:["come up with","roll out","set up"],a:0,x:"Trovare un'idea → *come up with*."},
    {t:"choice",p:"We'll ___ the new navigation to 10% of users first.",o:["roll out","figure out","follow up"],a:0,x:"Rilascio graduale → *roll out*."},
    {t:"gap",p:"Let's ___ up a call with the devs.",a:["set"],x:"Organizzare → *set up*."},
    {t:"gap",p:"I'll follow ___ by email after the meeting.",a:["up"],x:"*follow up*."},
    {t:"choice",p:"Non capisci il bug: “I can't ___.”",o:["figure it out","figure out it","figure it"],a:0,x:"Pronome in mezzo: *figure it out*."},
    {t:"order",p:"Il cliente deve approvare il design.",w:["The","client","has","to","sign","off","on","the","design."],x:"*sign off on* + cosa."},
    {t:"fix",p:"I can't figure out it.",a:["I can't figure it out."],x:"Con *it* la particella va dopo."}]},
  { id:"m4l3", h:"I falsi amici del designer", min:8,
    tip:"Alcune parole sembrano italiane ma significano altro. I più pericolosi in riunione: **actually** = in realtà (non *attualmente*), **eventually** = alla fine (non *eventualmente*), **realize** = rendersi conto (non *realizzare un'app*).",
    vocab:[["actually","in realtà · attualmente = currently"],["eventually","alla fine · eventualmente = if needed"],["realize","rendersi conto · realizzare = build, make"],["consistent","coerente, uniforme · consistente = solid"],["control","comandare · controllare = check"],["attend","partecipare a · assistere = help"],["sensible","sensato · sensibile = sensitive"],["argument","litigio · argomento = topic"]],
    extra:"Per *realizzare* scegli tra *build, make, create, design, deliver*. Per *controllare*: *check, review, test*.",
    trap:["We realized a new app.","We built a new app."],
    q:[
    {t:"choice",p:"“Attualmente lavoro su un'app bancaria”",o:["Actually I work on a banking app.","Currently I'm working on a banking app.","Actually I'm working on a banking app."],a:1,x:"*Attualmente* = *currently*. *Actually* = in realtà."},
    {t:"choice",p:"“Eventualmente aggiungiamo un filtro” (se serve)",o:["Eventually we add a filter.","If needed, we can add a filter.","Eventual we add a filter."],a:1,x:"*Eventually* = alla fine. *Eventualmente* = *if needed*."},
    {t:"choice",p:"“Abbiamo realizzato un nuovo sito”",o:["We realized a new website.","We built a new website."],a:1,x:"*Realize* = rendersi conto."},
    {t:"choice",p:"“Puoi controllare il file?”",o:["Can you control the file?","Can you check the file?"],a:1,x:"*Control* = comandare."},
    {t:"choice",p:"“Le icone non sono coerenti”",o:["The icons aren't consistent.","The icons aren't solid."],a:0,x:"Nel design *consistent* = coerente, uniforme."},
    {t:"choice",p:"“Ho partecipato alla conferenza”",o:["I assisted the conference.","I attended the conference."],a:1,x:"*Attend* = partecipare."},
    {t:"choice",p:"“I dati degli utenti sono sensibili”",o:["User data is sensible.","User data is sensitive."],a:1,x:"*Sensible* = sensato."},
    {t:"fix",p:"Actually we're working on version 2. (intendi “attualmente”)",a:["Currently we're working on version 2.","We're currently working on version 2.","At the moment we're working on version 2.","Right now we're working on version 2."],x:"*Attualmente* = *currently / at the moment*."}]},
  { id:"m4l4", h:"Aggettivi per il feedback", min:8,
    tip:"Per confrontare due proposte: aggettivo corto + **-er than** (*cleaner than*), lungo con **more … than** (*more consistent than*). Il migliore: **the -est / the most**.",
    formula:[["Option B","blue"],["is","orange"],["cleaner / more intuitive","pink"],["than option A","green"]],
    rows:[["Option B","is","cleaner","than option A."],["This flow","is","more intuitive","than the old one."],["Version 3","is","the most accessible","of all."]],
    extra:"Coppie di contrari: *clean ↔ ==cluttered==, consistent ↔ ==inconsistent==, bold ↔ ==subtle==, readable ↔ ==hard to read==*. Irregolari: *good → ==better== → the best*, *bad → ==worse== → the worst*.",
    trap:["Option B is more clear of option A.","Option B is clearer than option A."],
    q:[
    {t:"gap",p:"Option B is ___ (clean) than option A.",a:["cleaner"],x:"Aggettivo corto: +er."},
    {t:"gap",p:"The new flow is ___ intuitive than the old one.",a:["more"],x:"Aggettivo lungo: *more*."},
    {t:"gap",p:"This is the ___ (good) version so far.",a:["best"],x:"*good → better → the best*."},
    {t:"choice",p:"Il contrario di *clean* (riferito a un'interfaccia):",o:["cluttered","bold","subtle"],a:0,x:"*Cluttered* = troppo pieno, disordinato."},
    {t:"match",p:"Abbina l'aggettivo al significato.",pairs:[["cluttered","pieno, disordinato"],["subtle","discreto, sottile"],["consistent","coerente"],["readable","leggibile"]],x:"Il lessico base di ogni design critique."},
    {t:"choice",p:"The contrast is ___ than before: we need to fix it.",o:["worse","badder","more bad"],a:0,x:"*bad → worse → the worst*."},
    {t:"fix",p:"This layout is more simple than the old one.",a:["This layout is simpler than the old one."],x:"*simple* è corto: *simpler*."}]},
  { id:"m4l5", h:"Sfida: il lessico in azione", min:10, final:true,
    tip:"Sei frasi con il lessico del modulo: componenti, phrasal verbs, falsi amici e confronti.",
    q:[
    {t:"trans",p:"Trascina il cursore per cambiare il volume.",a:["Drag the slider to change the volume."]},
    {t:"trans",p:"Dobbiamo trovare un nome migliore.",a:["We need to come up with a better name.","We have to come up with a better name.","We need to find a better name."]},
    {t:"trans",p:"Alla fine abbiamo scelto la versione B.",a:["Eventually we chose version B.","In the end we chose version B.","We eventually chose version B.","Finally we chose version B."]},
    {t:"trans",p:"Ho partecipato a un workshop sull'accessibilità.",a:["I attended an accessibility workshop.","I attended a workshop on accessibility.","I attended a workshop about accessibility."]},
    {t:"trans",p:"Questo layout è più semplice di quello vecchio.",a:["This layout is simpler than the old one."]},
    {t:"trans",p:"L'interfaccia è troppo piena.",a:["The interface is too cluttered.","The UI is too cluttered.","The interface is too busy."]},
    {t:"trans",p:"Spunta la casella per accettare.",a:["Check the box to accept.","Tick the box to accept.","Check the checkbox to accept."]},
    {t:"trans",p:"Rilasceremo la funzione gradualmente.",a:["We'll roll out the feature gradually.","We're going to roll out the feature gradually.","We'll roll the feature out gradually."]},
    {t:"trans",p:"Attualmente sto lavorando a una libreria di componenti.",a:["I'm currently working on a component library.","Currently I'm working on a component library.","At the moment I'm working on a component library."]},
    {t:"trans",p:"Le icone non sono coerenti.",a:["The icons aren't consistent.","The icons are not consistent."]},
    {t:"trans",p:"L'opzione B è più pulita dell'opzione A.",a:["Option B is cleaner than option A."]},
    {t:"trans",p:"Puoi controllare il prototipo?",a:["Can you check the prototype?","Could you check the prototype?","Can you review the prototype?","Could you review the prototype?"]}]} ] },

/* ---------------- MODULO 5 ---------------- */
{ id:"m5", color:"pink", icon:"chat", title:"Design critique e meeting", tag:"Speaking", sub:"Dare opinioni, interrompere, essere in disaccordo con garbo e chiudere la call.",
  lessons:[
  { id:"m5l1", h:"Dare un'opinione (e ammorbidirla)", min:8,
    tip:"Per un'opinione negativa, in inglese **neghi il think**: *I ==don't think== it works*, non *I think it doesn't work*. Ammorbidisci le critiche con **maybe, a bit, I wonder if**.",
    formula:[["I think / I don't think","purple"],["soggetto + verbo","blue"],["(ammorbidente)","green"]],
    rows:[["I think","the hierarchy works","really well."],["I don't think","the icon is","clear enough."],["I wonder if","we could make it","a bit bigger."]],
    extra:"Altre aperture: *In my opinion… · I believe… · From a user's point of view… · My concern is that…* Ammorbidenti: *a bit, slightly, maybe, perhaps*.",
    trap:["I think it doesn't work.","I don't think it works."],
    q:[
    {t:"choice",p:"Quale è più naturale?",o:["I think the label isn't clear.","I don't think the label is clear."],a:1,x:"Si nega il *think*."},
    {t:"choice",p:"Ammorbidisci: “Il testo è piccolo”",o:["The text is small.","The text is maybe a bit small.","The text is smallest."],a:1,x:"*maybe a bit* rende la critica gentile."},
    {t:"gap",p:"I ___ think the green works in dark mode. (negativa)",a:["don't","do not"],x:"*I don't think* + frase affermativa."},
    {t:"gap",p:"I ___ if we could try a different icon.",a:["wonder"],x:"*I wonder if…* = mi chiedo se…"},
    {t:"order",p:"Dal punto di vista dell'utente, è confuso.",w:["From","a","user's","point","of","view,","it's","confusing."],x:"Apertura da UX: *From a user's point of view*."},
    {t:"order",p:"La mia preoccupazione è che sia troppo lungo.",w:["My","concern","is","that","it's","too","long."],x:"*My concern is that…*"},
    {t:"fix",p:"In my opinion is too dark.",a:["In my opinion, it's too dark."],x:"Il soggetto non si omette mai: *it's*."},
    {t:"choice",p:"Il feedback più gentile:",o:["The button is too small.","I really like the layout, but I wonder if the button could be a bit bigger.","Make the button bigger."],a:1,x:"Positivo → *I wonder if* → *a bit*."}]},
  { id:"m5l2", h:"Interrompere e chiarire", min:8,
    tip:"Interrompere con educazione è una skill: usa una **formula pronta** + la tua domanda. Non costruire la frase da zero: impara il blocco intero.",
    formula:[["Formula pronta","purple"],["la tua domanda","green"]],
    rows:[["Sorry to interrupt, but","can I ask something?"],["Could I stop you there?","I have a question."],["Just to clarify,","do you mean the mobile version?"],["What do you mean by","“more premium”?"]],
    extra:"Se non hai capito: *Could you ==say that again==, please? · Could you ==slow down== a bit? · Sorry, I ==didn't catch== that.*",
    trap:["Can you repeat me?","Could you say that again?"],
    q:[
    {t:"choice",p:"Non hai capito l'ultima frase:",o:["Sorry, I didn't catch that.","Sorry, I didn't take that.","Sorry, I don't catch."],a:0,x:"*I didn't catch that* = non ho capito/sentito."},
    {t:"gap",p:"Sorry to ___, but can I ask a question?",a:["interrupt"],x:"*Sorry to interrupt, but…*"},
    {t:"gap",p:"Just to ___, do you mean the desktop version?",a:["clarify"],x:"*Just to clarify…* = giusto per chiarire."},
    {t:"choice",p:"Il cliente dice “make it pop”. Chiedi cosa intende:",o:["What do you mean by “pop”?","What do you intend with “pop”?","What means “pop”?"],a:0,x:"*What do you mean by…?*"},
    {t:"choice",p:"Parla troppo veloce:",o:["Could you slow down a bit?","Could you go more slow?","Can you speak more piano?"],a:0,x:"*slow down* = rallentare."},
    {t:"order",p:"Posso fermarti un attimo?",w:["Could","I","stop","you","there?"],x:"Formula pronta per interrompere."},
    {t:"fix",p:"Can you repeat me the last part?",a:["Can you repeat the last part?","Could you repeat the last part?"],x:"*repeat* non vuole *me*."},
    {t:"order",p:"Scusa, puoi ripetere per favore?",w:["Sorry,","could","you","say","that","again,","please?"],x:"Formula da imparare intera."}]},
  { id:"m5l3", h:"D'accordo e non d'accordo", min:8,
    tip:"**Agree** è un verbo: *I agree*, mai *I'm agree*. Per non essere d'accordo senza scontri: prima **riconosci** il punto dell'altro, poi **but** e la tua motivazione.",
    formula:[["Riconosci","green"],["but","orange"],["la tua idea","blue"]],
    rows:[["I see your point,","but","users need a shortcut."],["That's a good idea,","but","it might slow us down."],["I agree with you,","but","let's test it first."]],
    extra:"Accordo pieno: *Absolutely. · Exactly. · I couldn't agree more.* Disaccordo morbido: *I'm not sure I agree. · I see it a bit differently.*",
    trap:["I'm agree with you.","I agree with you."],
    q:[
    {t:"choice",p:"“Sono d'accordo”",o:["I'm agree.","I agree.","I'm agreed with."],a:1,x:"*agree* è un verbo: niente *am*."},
    {t:"choice",p:"Disaccordo gentile:",o:["You're wrong.","I see your point, but I'm not sure it works on mobile.","No, is bad."],a:1,x:"Riconosci → *but* → motivazione."},
    {t:"gap",p:"I couldn't agree ___.",a:["more"],x:"*I couldn't agree more* = sono assolutamente d'accordo."},
    {t:"gap",p:"I ___ your point, but we don't have time.",a:["see"],x:"*I see your point* = capisco il tuo punto."},
    {t:"order",p:"Non sono sicuro di essere d'accordo.",w:["I'm","not","sure","I","agree."],x:"Disaccordo morbido."},
    {t:"choice",ctx:"**Cliente:** “Can we make the logo bigger? Like, much bigger?”",p:"Qual è la risposta più professionale?",o:["No, it's ugly.","I see why you want more visibility, but a bigger logo might push the main action below the fold.","OK, I make it bigger."],a:1,x:"Riconosci → *but* → motivazione da UX."},
    {t:"fix",p:"I'm not agree with the new colors.",a:["I don't agree with the new colors.","I disagree with the new colors."],x:"Negativa di un verbo: *don't agree*."}]},
  { id:"m5l4", h:"Chiudere la riunione", min:8,
    tip:"Una buona call finisce con **riassunto + prossimi passi + chi fa cosa**. Tre formule bastano: *To sum up…*, *The next step is…*, *I'll follow up by email.*",
    formula:[["To sum up / In summary","purple"],["decisione","blue"],["next step + chi","green"]],
    rows:[["To sum up,","we keep the tab bar","and Marco fixes the icons."],["In summary,","we test version B","next week."],["So the next step is","a quick prototype","by Friday."]],
    extra:"Rimandare: *Let's ==take this offline==* (ne parliamo dopo, in pochi). Scadenze: *==by== Friday* = entro venerdì; *==until== Friday* = fino a venerdì.",
    trap:["We send it within Friday.","We'll send it by Friday."],
    q:[
    {t:"choice",p:"“Entro venerdì”",o:["within Friday","by Friday","until Friday"],a:1,x:"Scadenza → *by*."},
    {t:"gap",p:"To ___ up, we keep the current navigation.",a:["sum"],x:"*To sum up* = riassumendo."},
    {t:"gap",p:"I'll ___ up by email with the notes.",a:["follow"],x:"*follow up* = dare seguito."},
    {t:"choice",p:"Un tema lungo che riguarda solo due persone:",o:["Let's take this offline.","Let's go out.","Let's put it outside."],a:0,x:"*take this offline* = parliamone a parte."},
    {t:"order",p:"Il prossimo passo è un prototipo veloce.",w:["The","next","step","is","a","quick","prototype."],x:"*The next step is…*"},
    {t:"choice",ctx:"**PM:** “So, who's doing what?”",p:"Rispondi in modo chiaro:",o:["I'll update the flow and share it by Thursday.","I update the flow and I share within Thursday.","The flow will be updated maybe."],a:0,x:"Chi + *will* + cosa + *by* + quando."},
    {t:"fix",p:"We meet again the next week.",a:["We'll meet again next week.","Let's meet again next week.","We meet again next week."],x:"*next week* senza *the*."},
    {t:"order",block:true,p:"Metti in ordine la chiusura della call.",w:["To sum up, we keep version B.","I'll update the prototype.","I'll share it by Friday.","Thanks, everyone!"],x:"Riassunto → azione → scadenza → saluto."}]},
  { id:"m5l5", h:"Sfida: la design review", min:10, final:true,
    tip:"Sei frasi da design review: opinione, interruzione, disaccordo e chiusura.",
    q:[
    {t:"trans",p:"Dal punto di vista dell'utente, è confuso.",a:["From a user's point of view, it's confusing.","From the user's point of view, it's confusing."]},
    {t:"trans",p:"Scusa, non ho capito.",a:["Sorry, I didn't catch that.","Sorry, I didn't understand.","Sorry, I didn't get that."]},
    {t:"trans",p:"Puoi rallentare un po'?",a:["Could you slow down a bit?","Can you slow down a bit?","Could you slow down a little?"]},
    {t:"trans",p:"Non sono d'accordo con i nuovi colori.",a:["I don't agree with the new colors.","I disagree with the new colors."]},
    {t:"trans",p:"Riassumendo, teniamo la versione B.",a:["To sum up, we keep version B.","To sum up, we're keeping version B.","In summary, we keep version B."]},
    {t:"trans",p:"Ne parliamo dopo, a parte.",a:["Let's take this offline.","Let's talk about it later.","Let's discuss it later."]},
    {t:"trans",p:"Non penso che l'icona sia chiara.",a:["I don't think the icon is clear.","I don't think the icon is clear enough."]},
    {t:"trans",p:"Scusa se ti interrompo, ma posso fare una domanda?",a:["Sorry to interrupt, but can I ask a question?","Sorry to interrupt, but could I ask a question?","Sorry for interrupting, but can I ask a question?"]},
    {t:"trans",p:"Cosa intendi con “più premium”?",a:["What do you mean by “more premium”?"]},
    {t:"trans",p:"Sono d'accordo, ma testiamolo prima.",a:["I agree, but let's test it first."]},
    {t:"trans",p:"Capisco il tuo punto, ma non abbiamo tempo.",a:["I see your point, but we don't have time.","I see your point, but we don't have the time."]},
    {t:"trans",p:"Ti mando le note entro venerdì.",a:["I'll send you the notes by Friday.","I'll send the notes by Friday.","I'll send the notes to you by Friday."]}]} ] },

{ id:"m6", color:"blue", icon:"wave", title:"Pronuncia e parlato", tag:"Phonology", sub:"Accento delle parole, suoni che si confondono, parlato veloce e uno stand-up da leggere.",
  lessons:[
  { id:"m6l1", h:"L'accento delle parole", min:8,
    tip:"In inglese **una sillaba per parola è forte**, le altre quasi spariscono. Sbagliare l'accento confonde più che sbagliare un suono. Qui ci sono le parole del design che gli italiani sbagliano di più.",
    vocab:[["PRO·to·type","non pro-to-TI-pe"],["de·SIGN","la g non si sente: di-ZAIN"],["us·a·BIL·i·ty","accento sulla terza"],["IN·ter·face","accento sulla prima"],["de·VEL·op·er","non de-ve-LO-per"],["ty·POG·ra·phy","ti-PO-gra-fi"],["an·a·LYT·ics","accento su LYT"],["ac·CES·si·ble","accento sulla seconda"]],
    extra:"Trucco nomi/verbi: *a ==RE==cord* (nome) ma *to re==CORD==* (verbo); *a ==PRE==sent* (regalo) ma *to pre==SENT==* (presentare).",
    trap:["de-ve-LO-per","de-VEL-op-er"],
    q:[
    {t:"stress",say:"prototype",s:["pro","to","type"],a:0,x:"*PRO-to-type*."},
    {t:"stress",say:"developer",s:["de","vel","op","er"],a:1,x:"*de-VEL-op-er*."},
    {t:"stress",say:"usability",s:["us","a","bil","i","ty"],a:2,x:"*us-a-BIL-i-ty*."},
    {t:"stress",say:"interface",s:["in","ter","face"],a:0,x:"*IN-ter-face*."},
    {t:"stress",say:"typography",s:["ty","pog","ra","phy"],a:1,x:"*ty-POG-ra-phy*."},
    {t:"stress",say:"analytics",s:["an","a","lyt","ics"],a:2,x:"*an-a-LYT-ics*."},
    {t:"stress",say:"accessible",s:["ac","ces","si","ble"],a:1,x:"*ac-CES-si-ble*."},
    {t:"choice",p:"*to present* (verbo, presentare): dov'è l'accento?",o:["PRE-sent","pre-SENT"],a:1,x:"Verbo → accento sulla seconda."}]},
  { id:"m6l2", h:"Coppie minime", min:8,
    tip:"Due parole che cambiano per **un solo suono**: *ship / sheep*, *live / leave*. Sbagliare la vocale cambia il senso della frase. Scegli la parola giusta in base al significato, poi leggila ad alta voce allungando o accorciando la vocale.",
    vocab:[["ship · sheep","nave · pecora"],["live · leave","vivere · andare via"],["fill · feel","riempire · sentire"],["full · fool","pieno · sciocco"],["work · walk","lavorare · camminare"],["bug · bag","difetto · borsa"],["test · taste","test · gusto"]],
    extra:"La *i* corta (*ship, live, fill*) è rilassata e breve. La *ee* lunga (*sheep, leave, feel*) si fa sorridendo e tenendo il suono.",
    trap:["We need to fix this bag.","We need to fix this bug."],
    q:[
    {t:"choice",p:"We need to fix this ___. (difetto nel codice)",o:["bug","bag"],a:0,x:"*bug* = difetto; *bag* = borsa."},
    {t:"choice",p:"I have to ___ at 6. (andare via)",o:["live","leave"],a:1,x:"*leave* = andare via, i lunga; *live* = vivere, i corta."},
    {t:"choice",p:"We ___ from home on Fridays. (lavoriamo)",o:["work","walk"],a:0,x:"*work* = lavorare; *walk* = camminare."},
    {t:"choice",p:"Please ___ in the form. (compila)",o:["fill","feel"],a:0,x:"*fill* = riempire, i corta; *feel* = sentire, i lunga."},
    {t:"choice",p:"My calendar is ___ this week. (pieno)",o:["full","fool"],a:0,x:"*full* = pieno; *fool* = sciocco."},
    {t:"choice",p:"Let's ___ the new version with users. (testare)",o:["test","taste"],a:0,x:"*test* = testare; *taste* = assaggiare."},
    {t:"choice",p:"Quale parola ha la i lunga /iː/?",o:["ship","sheep","sit"],a:1,x:"*sheep*: i lunga, si fa sorridendo."},
    {t:"match",p:"Abbina la parola al significato.",pairs:[["ship","nave, spedire"],["sheep","pecora"],["live","vivere"],["leave","andare via"]],x:"Una vocale cambia tutto."}]},
  { id:"m6l3", h:"Il parlato veloce", min:8,
    tip:"Nel parlato le parole si accorciano: *going to* diventa *gonna*, *want to* diventa *wanna*. **Riconoscerle** ti fa capire i colleghi madrelingua; **scriverle** nelle email di lavoro invece non si fa.",
    formula:[["Scritto","blue"],["Parlato","pink"]],
    rows:[["going to","gonna"],["want to","wanna"],["have got to","gotta"],["let me","lemme"],["don't know","dunno"]],
    extra:"Forme deboli: *to* suona *tə*, *and* suona *ən*, *can* suona *kən*, *of* suona *əv*. Le parole piccole quasi spariscono: per questo nel parlato sembrano mancare.",
    trap:["I wanna to share my screen.","I want to share my screen."],
    q:[
    {t:"choice",p:"*I'm gonna share my screen* significa:",o:["I'm going to share my screen.","I'm gone to share my screen.","I'm gonna to share my screen."],a:0,x:"*gonna* = *going to*."},
    {t:"fix",p:"I wanna show you the new flow. (email di lavoro)",a:["I want to show you the new flow.","I'd like to show you the new flow."],x:"In un'email scrivi *want to*, o meglio *I'd like to*."},
    {t:"choice",p:"*Lemme check* significa:",o:["Let me check.","Leave me check.","Lend me check."],a:0,x:"*lemme* = *let me*."},
    {t:"choice",p:"*I dunno* significa:",o:["I don't know.","I do now.","I don't now."],a:0,x:"*dunno* = *don't know*."},
    {t:"gap",p:"*We gotta fix it* = We ___ to fix it.",a:["have got","'ve got","have"],x:"*gotta* = *have got to* = *have to*."},
    {t:"choice",p:"Nel parlato *to* in *I need to go* suona come:",o:["tə","tu","to"],a:0,x:"Forma debole: *tə*."},
    {t:"fix",p:"Can u send me the file?",a:["Can you send me the file?","Could you send me the file?"],x:"*u* va bene in chat tra amici, non al lavoro."}]},
  { id:"m6l4", h:"Lettura: lo stand-up", min:10,
    tip:"Negli aggiornamenti di lavoro non serve capire ogni parola: cerca **chi, cosa, quando**. Leggi **prima la domanda**, poi il testo: è la tecnica del *pre-reading* della guida.",
    vocab:[["stand-up","riunione breve quotidiana"],["blocker","ciò che ti blocca"],["handoff","passaggio del design agli sviluppatori"],["out of","su (four out of five = quattro su cinque)"]],
    extra:"Lo schema di ogni stand-up: *Yesterday I… · Today I'm going to… · My blocker is…*",
    trap:["Yesterday I finish the icons.","Yesterday I finished the icons."],
    q:[
    {t:"choice",ctx:"**Stand-up:** “Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.”",p:"Cosa ha finito ieri?",o:["The onboarding screens","The handoff","The final texts"],a:0,x:"*Yesterday I finished the new onboarding screens.*"},
    {t:"choice",ctx:"**Stand-up:** “Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.”",p:"Cosa farà oggi?",o:["Write the copy","Prepare the handoff","Test the onboarding"],a:1,x:"*Today I'm going to prepare the handoff.*"},
    {t:"choice",ctx:"**Stand-up:** “Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.”",p:"Vero o falso: il suo blocco sono gli sviluppatori.",o:["Vero","Falso"],a:1,x:"Il blocco è il copy: aspetta i testi dal marketing."},
    {t:"choice",ctx:"**Stand-up:** “Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.”",p:"Quanti utenti hanno completato il checkout?",o:["Five out of five","Four out of five","Two out of five"],a:1,x:"*four out of five* = quattro su cinque."},
    {t:"choice",ctx:"**Stand-up:** “Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.”",p:"Quale problema è emerso?",o:["The total was wrong","Nobody found the promo code field","The checkout was too slow"],a:1,x:"*Nobody found the promo code field.*"},
    {t:"choice",ctx:"**Stand-up:** “Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.”",p:"Cosa faranno la settimana prossima?",o:["Remove the promo code","Move the field above the total","Run another test"],a:1,x:"*We're going to move it above the total.*"},
    {t:"order",block:true,p:"Metti in ordine il tuo stand-up.",w:["Hi everyone, quick update from me.","Yesterday I finished the wireframes.","Today I'm going to test them with two users.","No blockers on my side."],x:"Saluto → ieri → oggi → blocchi."}]},
  { id:"m6l5", h:"Sfida: il tuo stand-up", min:10, final:true,
    tip:"Leggi, scrivi e prepara il tuo stand-up.",
    q:[
    {t:"trans",p:"Puoi mandarmi la versione finale entro venerdì?",a:["Could you send me the final version by Friday?","Can you send me the final version by Friday?"]},
    {t:"trans",p:"Nessuno ha trovato il campo del codice promo.",a:["Nobody found the promo code field.","No one found the promo code field."]},
    {t:"trans",p:"Ieri ho finito i wireframe.",a:["Yesterday I finished the wireframes.","I finished the wireframes yesterday."]},
    {t:"trans",p:"Nessun blocco da parte mia.",a:["No blockers from me.","No blockers on my side.","I have no blockers."]},

  if(!SB){await loadSB();SB=window.supabase.createClient(CLOUD.url,CLOUD.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){V.auth={mode:"newpass"};go({screen:"auth"})}})}
  return SB;
}
function itErr(m){m=String(m||"");
  if(/invalid login/i.test(m))return "Email o password errate.";
  if(/already registered|already been registered/i.test(m))return "Esiste già un account con questa email: accedi.";
  if(/email not confirmed/i.test(m))return "Prima conferma l'email: apri il link che ti abbiamo mandato.";
  if(/rate limit|too many/i.test(m))return "Troppi tentativi. Aspetta un minuto e riprova.";
  if(/failed to fetch|network/i.test(m))return "Nessuna connessione. Controlla internet e riprova.";
  if(/password/i.test(m))return "La password deve avere almeno 6 caratteri.";
  return m}
const nameOf=(user,email)=>((user&&user.user_metadata)||{}).name||email.split("@")[0];
async function cloudRegister(name,email,pass){
  const sb=await sbClient();
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});
  if(error)throw itErr(error.message);
  if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw "Esiste già un account con questa email: accedi.";
  if(!data.session){V.auth={mode:"login",email,info:"Ti abbiamo mandato un'email di conferma. Aprila, poi accedi qui."};render();throw null}
  return {uid:data.user.id,name,email,mode:"cloud"};
}
async function cloudLogin(email,pass){
  const sb=await sbClient();const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)throw itErr(error.message);
  return {uid:data.user.id,name:nameOf(data.user,email),email,mode:"cloud"};
}
async function cloudForgot(email){
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw "Scrivi prima la tua email qui sopra.";
  const sb=await sbClient();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)throw itErr(error.message);
}
async function cloudNewPass(pass){
  const sb=await sbClient();const {data,error}=await sb.auth.updateUser({password:pass});if(error)throw itErr(error.message);
  const email=data.user.email;return {uid:data.user.id,name:nameOf(data.user,email),email,mode:"cloud"};
}
/* Profilo e progressi vivono in due tabelle: profiles (chi sei) e progress (tutti i dati del corso) */
async function cloudWrite(){
  if(!USER||USER.mode!=="cloud"||!SB)return;
  if(!navigator.onLine){setSync("offline");return}
  setSync("saving");
  try{
    const {error}=await SB.from("progress").upsert({user_id:USER.uid,data:S,xp:S.xp,best_streak:S.best,lessons_done:Object.values(S.les).filter(x=>x.runs>0).length,updated_at:new Date().toISOString()});
    if(error)throw error;setSync("ok");
  }catch(e){setSync("err",String(e.message||e))}
}
function cloudPush(){if(!USER||USER.mode!=="cloud"||!SB)return;clearTimeout(pushT);pushT=setTimeout(cloudWrite,1200)}
function cloudFlush(){if(pushT){clearTimeout(pushT);pushT=null;cloudWrite()}}
async function cloudProfile(){
  try{await SB.from("profiles").upsert({id:USER.uid,name:USER.name,email:USER.email,updated_at:new Date().toISOString()})}catch(e){}
}
async function cloudPull(){
  setSync("saving");
  try{
    const {data,error}=await SB.from("progress").select("data").eq("user_id",USER.uid).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&(data.data._t||0)>(S._t||0)){S=Object.assign(blank(),data.data);S.stats=S.stats||{ok:0,n:0};fixData();lsSet(LSK_DATA+USER.uid,S);setSync("ok")}
    else await cloudWrite();
  }catch(e){setSync("err",String(e.message||e))}
}
async function signIn(u,isNew){
  const prev=USER&&USER.mode==="guest"?lsGet(LSK_DATA+"guest"):null;
  USER=u;lsSet(LSK_SESSION,u);loadUser();
  if(prev&&(isNew||u.mode==="cloud")&&!(S._t>0)){S=Object.assign(blank(),prev);S._t=Date.now();lsSet(LSK_DATA+u.uid,S)}
  if(u.mode==="cloud"){await cloudProfile();await cloudPull()}
  applyFreezes();V.auth=null;go({screen:"home",tab:"mods"});
  if(u.mode!=="guest")toast(isNew?`Benvenuto, ${u.name}`:`Bentornato, ${u.name}`);
}
async function signOut(){cloudFlush();if(USER&&USER.mode==="cloud"&&SB){try{await SB.auth.signOut()}catch(e){}}USER=null;lsDel(LSK_SESSION);S=blank();RUN=null;V.auth={mode:"login"};go({screen:"auth"})}
async function boot(){
  if(cloudOn()){
    try{
      const sb=await sbClient();const {data}=await sb.auth.getSession();
      if(/type=recovery/.test(location.hash)){V.auth={mode:"newpass"};V.screen="auth";render();return}
      if(data.session){const u=data.session.user;const s=lsGet(LSK_SESSION)||{};USER={uid:u.id,name:s.uid===u.id&&s.name?s.name:nameOf(u,u.email),email:u.email,mode:"cloud"};lsSet(LSK_SESSION,USER);
        if(location.hash)history.replaceState(null,"",location.pathname);
        loadUser();V.screen="home";render();await cloudPull();applyFreezes();render();return}
    }catch(e){const s0=lsGet(LSK_SESSION);if(s0&&s0.mode==="cloud"&&s0.uid&&lsGet(LSK_DATA+s0.uid)){USER=s0;loadUser();applyFreezes();V.screen="home";render();setTimeout(()=>toast("Sei offline: i progressi si salvano quando torni online"),500);return}V.auth={mode:"login",err:typeof e==="string"?e:""};V.screen="auth";render();return}
    const s=lsGet(LSK_SESSION);if(s&&s.mode==="guest"){USER=s;loadUser();applyFreezes();V.screen="home";render();return}
    V.auth={mode:"login"};V.screen="auth";render();return;
  }
  const s=lsGet(LSK_SESSION);
  if(s&&s.uid&&s.mode!=="cloud"){USER=s;loadUser();applyFreezes();V.screen="home";render()}
  else {V.auth={mode:lsGet(LSK_USERS)?"login":"register"};V.screen="auth";render()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")cloudFlush()});
window.addEventListener("online",()=>{if(USER&&USER.mode==="cloud")cloudWrite()});
async function submitAuth(){
  const A=V.auth;const name=($("#au-name")||{}).value||"",email=(($("#au-email")||{}).value||"").trim(),pass=($("#au-pass")||{}).value||"";
  A.name=name;A.email=email;A.info="";
  if(A.mode==="register"&&!name.trim()){A.err="Scrivi il tuo nome.";render();return}
  if(A.mode!=="newpass"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){A.err="Controlla l'email: manca qualcosa.";render();return}
  if(pass.length<6){A.err="La password deve avere almeno 6 caratteri.";render();return}
  A.err="";A.busy=true;render();
  try{
    const reg=A.mode==="register";let u;
    if(A.mode==="newpass")u=await cloudNewPass(pass);
    else u=cloudOn()?(reg?await cloudRegister(name.trim(),email,pass):await cloudLogin(email,pass)):(reg?await localRegister(name.trim(),email,pass):await localLogin(email,pass));
    A.busy=false;await signIn(u,reg);
  }catch(err){if(err===null){V.auth.busy=false;render();return}A.busy=false;A.err=typeof err==="string"?err:"Qualcosa non ha funzionato. Riprova.";render()}
}
async function forgot(){
  const A=V.auth;const email=(($("#au-email")||{}).value||"").trim();A.email=email;A.err="";A.info="";
  try{await cloudForgot(email);A.info="Ti abbiamo mandato un link per scegliere una nuova password."}catch(e){A.err=typeof e==="string"?e:"Non è stato possibile inviare l'email."}
  render();
}

/* Il perché delle regole: la logica dietro ogni struttura */
const WHY={
m1l1:["In inglese il soggetto non si sottintende mai: l'italiano dice *sono stanco*, l'inglese vuole sempre *I am*, *it is*.","*BE* ha tre forme al presente (*am, is, are*) e non usa *do* nelle domande: è già un ausiliare, quindi basta invertirlo con il soggetto (*Are you…?*).","*Avere anni, fame, ragione* in inglese descrive uno stato, non un possesso: per questo si usa *be* (*I'm 40, I'm right*)."],
m1l2:["La S della terza persona è l'ultima desinenza rimasta dall'inglese antico: non c'è una logica da capire, è un'abitudine da allenare.","Con *he, she, it* il verbo prende la S; con tutte le altre persone resta uguale.","*The team, the app, my manager* sono una cosa sola, quindi equivalgono a *it/he/she* e vogliono la S."],
m1l3:["Perché *do*? I verbi normali non si possono invertire con il soggetto (*Work you?* non esiste): serve un aiutante, *do*, che va davanti e porta tempo e persona.","Per questo con *does* il verbo torna nudo: la S l'ha già presa *does*. *Does she work?*, mai *Does she works?*","Con *be* e con i modali (*can, will, should*) *do* non serve: sono già ausiliari e si invertono da soli (*Is it…? Can you…?*).","Nelle negative vale lo stesso: *not* ha bisogno di appoggiarsi a un ausiliare, quindi *don't / doesn't* + verbo nudo."],
m1l4:["L'inglese separa ciò che è abituale (*I work*) da ciò che succede ora o in questo periodo (*I'm working*); l'italiano usa spesso il presente per tutti e due.","*BE + -ing* descrive un'azione in corso, come il nostro *sto facendo*.","I verbi di stato (*know, like, want, need, understand*) indicano condizioni, non azioni con una durata: per questo non prendono *-ing*."],
m2l1:["Il passato semplice inglese copre sia il nostro passato prossimo sia il remoto: *I sent* = ho mandato, mandai.","Si usa per azioni finite in un momento preciso, ed è per questo che va con *yesterday, last week, in 2020*.","Gli irregolari sono i verbi più antichi e più usati: pochi, ma ovunque. Conviene impararli a memoria, come parole nuove."],
m2l2:["Come al presente, i verbi normali non si invertono: serve l'aiutante *do*, che al passato diventa *did*.","*did* porta già il passato, quindi il verbo torna nudo: *Did you send…?*, *I didn't send…*. Il passato si segna una volta sola.","Con *was / were* *did* non serve: sono già ausiliari (*Were you there? I wasn't ready.*)."],
m2l3:["Il passato progressivo è un fermo immagine: cosa stava succedendo in quel momento.","Per questo si combina con il passato semplice: l'azione lunga fa da sfondo (*was working*), quella breve la interrompe (*called*).","*I was wondering if…* suona più gentile di *I wonder* perché il passato crea distanza: la richiesta diventa meno diretta."],
m2l4:["Il present perfect collega passato e presente: qualcosa è successo prima, ma conta adesso.","Per questo non va con una data precisa: con *in 2020* l'azione è chiusa nel passato e serve il passato semplice.","*since* indica il punto di partenza, *for* la durata. L'italiano usa il presente (*lavoro qui dal 2013*); l'inglese no, perché l'azione parte dal passato e arriva a oggi."],
m3l1:["L'inglese non ha un solo futuro: sceglie la forma in base a quanto la cosa è già decisa.","*will* = decisione presa ora, promessa, previsione. *going to* = intenzione decisa prima. *BE + -ing* = appuntamento fissato con altri.","*will* è un modale: dopo vuole il verbo nudo, senza *to* e senza S."],
m3l2:["*will have + participio* guarda indietro da un punto futuro: a quella data l'azione sarà già conclusa.","*will be + -ing* fotografa un momento futuro: in quell'istante l'azione sarà in corso.","Sono le forme delle scadenze e delle stime: perfette per roadmap e pianificazione."],
m3l3:["Dopo *if* e *when* si usa il presente perché la condizione è vista come già reale: il futuro sta solo nella conseguenza.","Mettere *will* in entrambe le parti è l'errore tipico degli italiani, perché diciamo *se finirò*.","Con *if* + passato + *would* l'ipotesi diventa poco probabile: il passato allontana dalla realtà."],
m3l4:["I modali sono ausiliari speciali: non prendono la S, non vogliono *to* dopo e non usano *do* nelle domande.","Ognuno esprime un grado diverso di certezza o di obbligo: dal più sicuro (*will, must*) al più aperto (*might, could*).","*must* = obbligo che senti tu; *have to* = obbligo che arriva da fuori. *don't have to* = non serve; *mustn't* = è vietato."],
m4l1:["I team internazionali chiamano i componenti con nomi precisi: usarli evita ambiguità nell'handoff.","Associare parola e immagine del componente (*dual coding*) la fa ricordare molto meglio di una traduzione."],
m4l2:["Un phrasal verb è verbo + particella, e la particella cambia il significato: *roll* (rotolare) + *out* = rilasciare.","Il significato spesso non si deduce dalle parti: va imparato come una parola nuova, dentro una frase.","Con un pronome (*it, them*) la particella va dopo: *figure it out*, perché il pronome corto si infila in mezzo."],
m4l3:["I falsi amici sono parole latine entrate nelle due lingue in momenti diversi, che hanno preso significati diversi.","Sono pericolosi proprio perché sembrano facili: cambiano il senso di una frase senza che nessuno se ne accorga."],
m4l4:["Gli aggettivi corti prendono *-er / -est*; quelli lunghi usano *more / most*, perché aggiungere sillabe li renderebbe difficili da pronunciare.","*than* introduce il secondo termine del paragone: in italiano diciamo *di*, ma *of* qui è sbagliato.","Nel feedback i comparativi rendono la critica concreta: *clearer than, more consistent than*."],
m5l1:["Si nega il verbo di opinione (*I don't think it's clear*) perché suona più morbido che negare il fatto (*I think it isn't clear*).","Gli ammorbidenti (*maybe, a bit, I wonder if*) sono tipici della cultura di lavoro anglosassone: una critica diretta può sembrare aggressiva."],
m5l2:["Le formule pronte si imparano come blocchi unici: in una call non c'è tempo di costruire la frase parola per parola.","*Could* è più cortese di *can*: la forma al passato crea distanza, quindi gentilezza."],
m5l3:["*agree* è un verbo, non un aggettivo: *I agree*, come *I like*. Per questo *I'm agree* è sbagliato.","Lo schema riconosci → *but* → motivo mantiene buona la relazione e sposta la discussione sui dati."],
m5l4:["Chiudere con riassunto, prossimi passi e responsabili evita malintesi dopo la call.","*by* = entro una scadenza; *until* = per tutto il tempo fino a un momento; *within* va con una durata (*within two days*), non con un giorno."],
m6l1:["In inglese le sillabe senza accento si riducono quasi a un suono neutro: con l'accento sbagliato la parola diventa difficile da riconoscere.","Molte parole hanno l'accento su una sillaba diversa dall'italiano (*PROtotype, deVELoper*): conviene impararle ascoltando."],
m6l2:["L'italiano ha 7 suoni vocalici, l'inglese circa 12: per questo *ship / sheep* ci sembrano uguali.","Allenare l'orecchio aiuta anche la pronuncia: si produce bene solo ciò che si sente bene."],
m6l3:["Nel parlato le parole piccole (*to, the, and, can*) si riducono a forme deboli: conoscerle ti fa capire i colleghi madrelingua.","*gonna, wanna, gotta* si dicono ma non si scrivono al lavoro: riconoscerli sì, usarli nelle email no."],
m6l4:["Negli aggiornamenti di lavoro non serve capire tutto: cerca le informazioni chiave (chi, cosa, quando).","Leggere prima la domanda dice al cervello cosa cercare nel testo: è il *pre-reading*."]
};

m1l3:[

 {h:"Contrazioni",p:"*do not → ==don't==*, *does not → ==doesn't==*. Nel parlato e nelle chat si usano sempre le forme contratte."}],

 {h:"Come si forma il -ING",t:[["Regola","Esempi"],["+ ing","work → working · test → testing"],["la e finale cade","make → making · share → sharing"],["raddoppio dopo vocale breve accentata","run → running · plan → planning · ship → shipping"],["ie → ying","lie → lying · die → dying"],["ee resta","see → seeing · agree → agreeing"]]},
 {h:"Verbi che non prendono -ING (verbi di stato)",c:["know","understand","believe","mean","want","need","prefer","like","love","hate","seem","belong","own","cost","remember","agree"],p:"Indicano stati, non azioni: *I ==know==, I ==need== it, It ==costs== €20*. Eccezione utile: *I'm ==thinking== about it* (= sto valutando) va bene, *I ==think== it's good* (= credo) no -ing."},

function timeline(kind){
  const X={past:40,now:150,fut:260};let m="";
  const dot=(x,f)=>`<circle cx="${x}" cy="26" r="6" ${f?'fill="var(--c)"':'fill="var(--card-solid)" stroke="var(--c)" stroke-width="2.5"'}/>`;
  const bar=(a,b)=>`<rect x="${a}" y="21" width="${b-a}" height="10" rx="5" fill="var(--c)" opacity=".85"/>`;
  const line=x=>`<line x1="${x}" y1="12" x2="${x}" y2="40" stroke="var(--label2)" stroke-width="2" stroke-dasharray="3 3"/>`;
  switch(kind){
    case "habit":m=[50,90,130,170,210,250].map(x=>dot(x,1)).join("");break;
    case "now":m=bar(125,175);break;
    case "bridge":m=`<line x1="70" y1="26" x2="150" y2="26" stroke="var(--c)" stroke-width="3"/>`+dot(70,1)+dot(150,0);break;
    case "bridgeing":m=bar(70,152)+dot(150,0);break;
    case "dot":m=dot(85,1);break;
    case "spanpast":m=bar(50,115)+`<path d="M86 14 l8 24 M94 14 l-8 24" stroke="var(--bad)" stroke-width="3"/>`;break;
    case "before":m=dot(55,1)+dot(110,0);break;
    case "beforeing":m=bar(30,104)+dot(110,0);break;
    case "future":m=dot(220,1);break;
    case "spanfuture":m=bar(195,250);break;
    case "deadline":m=dot(205,1)+line(240);break;
    case "deadlineing":m=bar(165,238)+line(242);break;
    default:return "";
  }
  return `<div class="tl"><svg viewBox="0 0 300 58" role="img" aria-label="${esc(TL[kind]||"")}"><line x1="10" y1="26" x2="290" y2="26" stroke="var(--label3)" stroke-width="2"/>${line(150).replace('var(--label2)','var(--label)')}${m}<text x="${X.past}" y="54" font-size="10" fill="var(--label2)" text-anchor="middle">PASSATO</text><text x="${X.now}" y="54" font-size="10" fill="var(--label)" text-anchor="middle" font-weight="700">ORA</text><text x="${X.fut}" y="54" font-size="10" fill="var(--label2)" text-anchor="middle">FUTURO</text></svg><span>${esc(TL[kind]||"")}</span></div>`;
}

const $ = s=>document.querySelector(s);
function TODAY(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function addDays(iso,d){const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()+d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/==(.+?)==/g,'<span class="hl">$1</span>').replace(/\*(.+?)\*/g,"<em>$1</em>")}
function plain(s){return String(s).replace(/\*\*|==|\*/g,"")}
function canon(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"«»]/g," ");
  /* contrazioni scritte senza apostrofo (comode sulla tastiera del telefono) */
  s=s.replace(/\b(is|are|was|were|do|does|did|has|have|had|could|should|would|must)nt\b/g,"$1n't").replace(/\bwont\b/g,"won't").replace(/\bcant\b/g,"can't")
     .replace(/\bim\b/g,"i'm").replace(/\b(you|they)re\b/g,"$1're").replace(/\b(i|you|we|they)ve\b/g,"$1've").replace(/\b(you|they|it)ll\b/g,"$1'll").replace(/\b(she|he|that|what|it)s\b/g,"$1's").replace(/\blets\b/g,"let's");
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/n't\b/g," not")
     .replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would");
  s=s.replace(/\bcolour/g,"color").replace(/\bokay\b/g,"ok").replace(/\bstand-up\b/g,"standup").replace(/\bstand up\b/g,"standup");
  return s.replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(n,seed){const a=[...Array(n).keys()];let x=hash(seed)||1;for(let i=n-1;i>0;i--){x=Math.imul(x^(x>>>15),2246822507)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}
function rshuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------------- progressi, XP e serie ---------------- */
function lst(id){return S.les[id]||(S.les[id]={runs:0,best:0,run:null})}
function lProg(l){const s=S.les[l.id];if(!s)return {runs:0,best:0,active:false,done:0,len:RUN_LEN,pct:0};const r=s.run;const open=r&&!r.complete;const done=open?Object.keys(r.ans).length:0;return {runs:s.runs,best:s.best,active:!!open&&done>0,done,len:open?r.items.length:RUN_LEN,pct:s.runs>0?1:open?done/r.items.length:0}}
function mProg(m){let c=0,sum=0,runs=0,best=0,nb=0;m.lessons.forEach(l=>{const p=lProg(l);if(p.runs>0){c++;best+=p.best;nb++}runs+=p.runs;sum+=p.pct});return {c,L:m.lessons.length,pct:sum/m.lessons.length,runs,best:nb?Math.round(best/nb):0}}
function mState(m){const p=mProg(m);return p.pct===0?"todo":p.c===p.L?"done":"doing"}
function nextLesson(){
  for(const m of MODS)for(const l of m.lessons)if(lProg(l).active)return l;
  for(const m of MODS)for(const l of m.lessons)if(lProg(l).runs===0)return l;
  let b=null;for(const m of MODS)for(const l of m.lessons)if(!b||lProg(l).runs<lProg(b).runs)b=l;return b;
}
function isAct(d){return (S.days[d]||0)>=10||!!S.frozen[d]}
function streak(){let d=TODAY();if(!isAct(d))d=addDays(d,-1);let n=0;while(isAct(d)){n++;d=addDays(d,-1)}return n}
function applyFreezes(){
  const t=TODAY();if(isAct(t))return;let d=addDays(t,-1);const miss=[];
  for(let i=0;i<30&&!isAct(d);i++){miss.push(d);d=addDays(d,-1)}
  if(!miss.length||!isAct(d)||miss.length>S.freezes)return;
  miss.forEach(x=>S.frozen[x]=true);S.freezes-=miss.length;save();
  setTimeout(()=>toast(miss.length===1?"Una protezione ha salvato la tua serie":"Le protezioni hanno salvato la tua serie"),600);
}
function gain(x){
  const t=TODAY();const wasAct=isAct(t),before=S.days[t]||0;
  S.xp+=x;S.days[t]=before+x;
  const sk=streak();if(sk>S.best)S.best=sk;
  if(!wasAct&&isAct(t)){if(RUN)RUN.streakUp=true;toast(sk>1?`Serie di ${sk} giorni`:"Serie iniziata: torna domani")}
  else if(before<S.goal&&S.days[t]>=S.goal){if(RUN)RUN.goalHit=true;toast("Obiettivo di oggi raggiunto")}
  if(sk>0&&sk%7===0&&S.fzAt!==sk){S.fzAt=sk;if(S.freezes<2){S.freezes++;setTimeout(()=>toast("Hai guadagnato una protezione serie"),1600)}}
}
function totals(){let les=0,all=0,runs=0;MODS.forEach(m=>m.lessons.forEach(l=>{all++;const p=lProg(l);runs+=p.runs;if(p.runs>0)les++}));const st=S.stats||{ok:0,n:0};return {les,all,runs,acc:st.n?Math.round(st.ok/st.n*100):0,seen:Object.values(S.seenQ).reduce((a,x)=>a+x.length,0)}}

/* ---------------- costruzione delle sessioni (mai ripetute) ---------------- */
function buildItems(l,n,genOnly){
  const seen=new Set(S.seenQ[l.id]||[]);const out=[];const ids=new Set();
  const add=(id,q)=>{out.push({id,lid:l.id,q});ids.add(id)};
  const qid=q=>l.id+"~"+hash(JSON.stringify(q,(k,v)=>k==="it"?undefined:v)).toString(36);
  if(!genOnly)l.q.forEach(q=>{const id=qid(q);if(!AUDIO_ONLY(q)&&out.length<(l.final?6:n)&&!seen.has(id)&&!ids.has(id))add(id,q)});
  const gens=genFor(l);const order=rshuffle(gens.map((_,i)=>i));let k=0,tries=0;
  while(out.length<n&&gens.length&&tries<500){
    tries++;let q=null;try{q=gens[order[k++%order.length]]()}catch(e){q=null}
    if(AUDIO_ONLY(q))continue;
    const id=qid(q);
    if(ids.has(id)||(seen.has(id)&&tries<420))continue;
    add(id,q);
  }
  S.seenQ[l.id]=[...seen,...ids];return out;
}
function lessonSteps(l,items){
  const steps=[];
  if(l.final){steps.push({k:"intro"});items.forEach((_,i)=>steps.push({k:"q",i}))}
  else{steps.push({k:"q",i:0,pre:true});steps.push({k:"trick"});for(let i=1;i<items.length;i++)steps.push({k:"q",i})}
  steps.push({k:"sum"});return steps;
}
function newRunObj(kind,extra){return Object.assign({kind,res:[],combo:0,xp:{base:0,combo:0,done:0,perfect:0},pos:0},extra)}
function startLesson(id,fresh){
  const l=LES[id];const st=lst(id);
  if(fresh||!st.run||st.run.complete){st.run={items:buildItems(l,RUN_LEN),ans:{},trick:false,complete:false};save()}
  const r=st.run;const steps=lessonSteps(l,r.items);const a=r.ans;let pos=0;
  if(l.final)pos=Object.keys(a).length?steps.findIndex(s=>s.k==="q"&&!a[s.i]):0;
  else if(!a[0])pos=0;else if(!r.trick)pos=1;else pos=steps.findIndex(s=>s.k==="q"&&!a[s.i]);
  if(pos<0)pos=steps.length-1;
  RUN=newRunObj("lesson",{id,items:r.items,steps,pos,c:cv(l.mod)});
  V.sheet=null;V.screen="run";resetSel();stopGame();render();window.scrollTo({top:0});autoSpeak();
}

/* ---------------- verifica ---------------- */
function textMatch(given,acc){
  const c=canon(given);let best=acc[0],bd=1e9;
  for(const a of acc){const ca=canon(a);if(ca===c)return {ok:true,correct:a};const d=lev(c,ca);if(d<bd){bd=d;best=a}}
  return {ok:false,correct:best,near:c.length>0&&bd<=Math.max(1,Math.floor(canon(best).length/12))};
}
function canVerify(q){
  if(!sel)return false;
  switch(q.t){
    case "choice":case "ui":case "listen":case "stress":return sel.j!=null;
    case "gap":case "fix":case "trans":case "dict":return sel.text.trim().length>0;
    case "order":return sel.picked.length===q.w.length;
    case "match":return Object.keys(sel.map).length===q.pairs.length;
    case "shadow":return true;
  }return false;
}
function accOf(q){return q.t==="dict"?(q.a||[q.say]):q.a}
function check(q){
  switch(q.t){
    case "choice":case "ui":case "listen":return {ok:sel.j===q.a,correct:plain(q.o[q.a]),given:plain(q.o[sel.j])};
    case "stress":return {ok:sel.j===q.a,correct:q.s.map((x,i)=>i===q.a?x.toUpperCase():x).join("·"),given:q.s.map((x,i)=>i===sel.j?x.toUpperCase():x).join("·")};
    case "gap":{const r=textMatch(sel.text,q.a);r.near=false;r.given=sel.text.trim();return r}
    case "fix":case "trans":case "dict":{const r=textMatch(sel.text,accOf(q));r.given=sel.text.trim();return r}
    case "order":{const g=sel.picked.map(i=>q.w[i]).join(" ");return {ok:canon(g)===canon(q.w.join(" ")),correct:q.w.join(" "),given:g}}
    case "match":{const ok=q.pairs.every((p,i)=>sel.map[i]===i);return {ok,correct:q.pairs.map(p=>p[0]+" = "+p[1]).join(" · "),given:""}}
    case "shadow":return {ok:true,correct:q.say,given:""};
  }
}
function verify(){
  const st=RUN.steps[RUN.pos];const q=curItem().q;if(!canVerify(q))return;
  const r=check(q);FB=Object.assign({x:q.x||"",t:q.t,pre:!!st.pre},r);
  record(r.ok,r.given);render();
  if(!r.ok&&(q.t==="listen"||q.t==="stress"))setTimeout(()=>speak(q.say),300);
}
function record(ok,given){
  const st=RUN.steps[RUN.pos];const it=RUN.items[st.i];const q=it.q;
  if(RUN.kind==="lesson"){const r=S.les[RUN.id].run;r.ans[st.i]={ok,g:given||""};if(!ok&&!st.pre)srsAdd(it)}
  else if(RUN.kind==="review")srsResult(it.id,ok);
  else if(!ok)srsAdd(it);
  S.stats.n++;if(ok)S.stats.ok++;
  let xp=0;
  if(ok){RUN.combo++;const base=q.t==="shadow"?5:10;const cb=RUN.combo>=3?Math.min(10,(RUN.combo-2)*2):0;xp=base+cb;RUN.xp.base+=base;RUN.xp.combo+=cb;gain(xp)}else RUN.combo=0;
  FB.xp=xp;FB.combo=RUN.combo;RUN.res.push({id:it.id,ok});save();
}
function overrideOk(){
  const st=RUN.steps[RUN.pos];const it=RUN.items[st.i];
  if(RUN.kind==="lesson"){S.les[RUN.id].run.ans[st.i].ok=true;delete S.srs[it.id]}
  else if(RUN.kind==="review"){const s=S.srs[it.id];if(s){s.box=Math.min(5,(s.box||1)+1);s.due=addDays(TODAY(),IV[s.box])}}
  else delete S.srs[it.id];
  S.stats.ok++;RUN.res[RUN.res.length-1].ok=true;RUN.combo++;RUN.xp.base+=10;gain(10);save();FB.ok=true;FB.xp=10;FB.overridden=true;render();
}

function fcStats(){const all=fcDeck(),t=TODAY();let due=0,learned=0;all.forEach(w=>{const c=S.fc[w[0]];if(c){if(c.due<=t)due++;if(c.box>=3)learned++}});const newLeft=S.fcNew.d===t?Math.max(0,8-S.fcNew.n):8;return {total:all.length,due,learned,fresh:Math.min(newLeft,all.filter(w=>!S.fc[w[0]]).length)}}

function renderQ(st){
  const it=RUN.items[st.i];const l=LES[it.lid];const chI=it.lid.startsWith("ch-")?CHMAP[it.lid.slice(3)]:null;const q=it.q;const done=!!FB;const seed=it.id;
  if(!done&&!sel.init){sel.init=true;if(q.t==="fix")sel.text=q.p.replace(/\s*\(.*?\)\s*$/,"");if(q.t==="match")sel.L=0}
  const label=(q.lab||TYPE_LABEL[q.t])+(RUN.kind==="review"||RUN.kind==="mix"?" · "+(l?l.mod.title:chI?chI.en:""):"");
  let h=`<p class="qtype">${st.pre?`<span class="pre">Pre-test</span>`:""}${esc(label)}</p>`;
  if(st.pre&&!done)h+=`<p class="qhint">Prova a indovinare prima di studiare: anche un errore qui ti aiuta a ricordare la regola.</p>`;
  if(q.ctx)h+=`<div class="ctx">${fmt(q.ctx)}</div>`;
  if(q.ctxSay)h+=`<div class="audio"><button class="play" data-say="${esc(q.ctxSay)}" aria-label="Ascolta l'audio">${IC.play}</button><span><span class="at" style="display:block">Ascolta l'audio</span><span class="as">Anche due volte</span></span><button class="slow" data-say="${esc(q.ctxSay)}" data-rate="0.75">Lento</button></div>${done?`<p class="transcript"><em>${esc(q.ctxSay)}</em></p>`:""}`;
  const itl=q.it&&q.t!=="trans"?`<p class="qit"><b>IT</b><span>${esc(q.it)}</span></p>`:"";
  switch(q.t){
    case "choice":case "ui":{
      if(q.t==="ui")h+=`<div class="mock" aria-label="Componente da riconoscere">${mock(q.k)}</div>`;
      h+=`<p class="qp">${fmt(q.p)}</p>${itl}<div class="opts">${q.o.map((o,j)=>optBtn(o,j,q.a,done)).join("")}</div>`;break}
    case "listen":
      h+=`<p class="qp">Quale parola senti?</p><div class="audio"><button class="play" data-say="${esc(q.say)}" aria-label="Ascolta">${IC.play}</button><span><span class="at" style="display:block">Ascolta</span><span class="as">Tocca per riascoltare</span></span><button class="slow" data-say="${esc(q.say)}" data-rate="0.6">Lento</button></div>
      <div class="optgrid">${q.o.map((o,j)=>optBtn(o,j,q.a,done,true)).join("")}</div>`;break;
    case "stress":
      h+=`${itl}<p class="qp">Tocca la sillaba forte${q.hint?` <span class="qhint" style="display:block">${esc(q.hint)}</span>`:""}</p><div class="audio"><button class="play" data-say="${esc(q.say)}" aria-label="Ascolta">${IC.play}</button><span><span class="at" style="display:block">${esc(q.say)}</span><span class="as">Ascolta e scegli</span></span></div>
      <div class="syl">${q.s.map((s,j)=>{let c="";if(done){if(j===q.a)c="isok";else if(j===sel.j)c="isko"}else if(sel.j===j)c="sel";return `<button class="${c}" data-opt="${j}" ${done?"disabled":""}>${esc(s)}</button>`}).join("")}</div>`;break;
    case "gap":{
      const parts=q.p.split("___");const cls=done?(FB.ok?"ok":"ko"):"";
      h+=`<p class="qp">${fmt(parts[0])}<input id="ans" class="${cls}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta" ${done?"disabled":""} value="${esc(sel.text)}">${fmt(parts[1]||"")}</p>${itl}`;break}
    case "fix":case "trans":{
      h+=`<p class="qp">${q.t==="fix"&&!q.lab?`<span style="text-decoration:underline wavy var(--bad);text-underline-offset:6px;text-decoration-thickness:1.5px">${fmt(q.p)}</span>`:fmt(q.p)}</p>${itl}

      const line=sel.picked.map(k=>`<button class="word ${blk?"blk":""}" data-unpick="${k}" ${done?"disabled":""}>${blk?`<span class="bn">${sel.picked.indexOf(k)+1}</span>`:""}${esc(q.w[k])}</button>`).join("");
      const bank=order.map(k=>`<button class="word ${blk?"blk":""} ${sel.picked.includes(k)?"ghost":""}" data-pick="${k}" ${done||sel.picked.includes(k)?"disabled":""}>${esc(q.w[k])}</button>`).join("");

    case "match":{
      const ro=shuffled(q.pairs.length,seed);
      const tagCol=k=>["var(--blue)","var(--orange)","var(--pink)","var(--green)","var(--purple)"][k%5];
      const left=q.pairs.map((p,k)=>{let c=sel.L===k?"cur":"";if(done)c=sel.map[k]===k?"ok":"ko";const has=sel.map[k]!=null;
        return `<button class="mt ${c}" data-ml="${k}" ${done?"disabled":""}><span class="tag" style="background:${has||done?tagCol(k):"var(--label3)"}">${k+1}</span><b>${esc(p[0])}</b></button>`}).join("");
      const right=ro.map(k=>{const owner=Object.keys(sel.map).find(x=>sel.map[x]===k);let c="";if(done)c=sel.map[k]===k?"ok":"ko";
        return `<button class="mt ${c} ${!done&&owner!=null?"used":""}" data-mr="${k}" ${done?"disabled":""}>${owner!=null||done?`<span class="tag" style="background:${tagCol(done?k:+owner)}">${(done?k:+owner)+1}</span>`:""}<span>${esc(q.pairs[k][1])}</span></button>`}).join("");
      h+=`<p class="qp">${fmt(q.p)}</p>${itl}<p class="qhint">Tocca una parola a sinistra, poi il suo significato a destra.</p><div class="match"><div class="col">${left}</div><div class="col">${right}</div></div>`;break}
    case "shadow":
      h+=`<p class="qp">Ascolta, poi ripeti ad alta voce</p>

      <p class="secf">Shadowing: ripeti subito dopo la voce, anche sovrapponendoti. Tre volte: lento, normale, senza leggere.</p>`;break;

  let dock;

    const lbl=q.t==="shadow"?"L'ho ripetuta ad alta voce":"Verifica";
    dock=`<button class="btn" data-act="verify" ${canVerify(q)?"":"disabled"}>${lbl}</button>`;
  } else {

    const title=FB.ok?(FB.overridden?"Segnata come giusta":q.t==="shadow"?"Ottimo":FB.combo>=3?`Combo ×${FB.combo}!`:"Giusto!"):(FB.pre?"Normale sbagliare qui":FB.near?"Ci sei quasi":"Non proprio");
    let sol="";
    if(!FB.ok&&q.t!=="shadow")sol=`<p class="fsol">Soluzione: ${textual&&FB.given?diffMark(FB.correct,FB.given):`<strong>${esc(FB.correct)}</strong>`}</p>`;
    const sayTxt=sayFor(q);
    const links=`${sayTxt?`<button class="pill" data-say="${esc(plain(sayTxt))}">${IC.spk}Ascolta</button>`:""}${!FB.ok&&textual&&q.t!=="gap"?`<button class="pill" data-act="override">${IC.check}Era giusta</button>`:""}${!FB.ok&&(chapOfRun()||theoryLessons().length)?`<button class="pill" data-act="theory">${IC.bulb}Rivedi la teoria</button>`:""}`;
    const xx=FB.pre&&!FB.ok?"Ora il trick ti spiega perché. "+(FB.x?plain(FB.x):""):FB.x;
    dock=`<div class="fb"><span class="fi">${FB.ok?IC.check:IC.x}</span><div><p class="ft">${title}${FB.xp?`<span class="xpchip">${IC.bolt}+${FB.xp} XP</span>`:""}</p>${sol}${xx?`<p class="fx">${fmt(xx)}</p>`:""}${links?`<div class="flinks">${links}</div>`:""}</div></div>
      <button class="btn" data-act="next">Continua</button>`;
  }
  return {body:h,dock};
}
function sayFor(q){
  if(q.t==="listen"||q.t==="stress")return q.say;
  if(q.t==="shadow"||q.t==="match")return "";
  if(q.t==="gap")return q.p.replace(/\(.*?\)/g,"").replace("___",plain(q.a[0]));
  if(q.t==="choice"||q.t==="ui"){if(/___/.test(q.p))return q.p.replace(/\(.*?\)/g,"").replace("___",plain(q.o[q.a]));return isEnglish(q.o[q.a])?plain(q.o[q.a]):""}
  return FB.correct;
}
function isEnglish(s){return /^[A-Za-z0-9 ,.'’?!\-…"“”%:/]+$/.test(plain(s))&&!/^(Vero|Falso)$/.test(s)}
function optBtn(o,j,a,done,big){

  const mk=c==="isok"?IC.check:c==="isko"?IC.x:c==="sel"?IC.check:"";

}
function diffMark(correct,given){

}

function renderSplat(){
  const head=navBar({});
  if(!G)return `${head}<div style="--c:var(--orange)"><div class="lt"><p class="eyebrow">Gioco · 60 secondi</p><h1>Splat!</h1><p class="lead">Vedi il significato in italiano: tocca più veloce che puoi la parola inglese giusta. In classe si gioca colpendo la lavagna; qui basta il pollice.</p></div>
    <div class="group stats3" style="margin-top:12px"><div><p class="k">Parole</p><p class="v">${SPLAT.length}</p></div><div><p class="k">Durata</p><p class="v">60<small> s</small></p></div><div><p class="k">Record</p><p class="v">${S.splat}</p></div></div>
    <div class="btnrow"><button class="btn" data-act="gstart">Via!</button></div></div>`;
  if(!G.on)return `${head}<div style="--c:var(--orange)" class="summary"><span class="ringwrap">${ring(Math.min(1,G.score/20),"bigring",62,150)}<b>${G.score}</b></span><h1>${G.record?"Nuovo record!":"Tempo scaduto"}</h1><p>${G.score} giuste, ${G.miss} sbagliate · record ${S.splat}</p><div class="btnrow"><button class="btn" data-act="gstart">Gioca ancora</button><button class="btn ghost" data-act="back">Torna al ripasso</button></div></div>`;
  return `${head}<div style="--c:var(--orange)"><div class="splat-top"><span class="timer ${G.left<=10?"low":""}">${Math.floor(G.left/60)}:${String(G.left%60).padStart(2,"0")}</span><span class="score"><b>${G.score}</b><span>punti</span></span></div>
  <div class="bar"><i style="width:${G.left/60*100}%"></i></div>
  <div class="splat-q ${G.flash==="ko"?"flash-ko":G.flash==="ok"?"flash-ok":""}">${esc(G.cur.it[1])}</div>
  <div class="optgrid">${G.cur.opts.map((o,j)=>`<button class="opt" data-splat="${j}">${esc(o[0])}</button>`).join("")}</div></div>`;
}

/* ===================================================================== EVENTI */
document.addEventListener("click",e=>{
  if(e.target.closest(".sheet")&&!e.target.closest("button"))return;
  if(e.target.closest(".tsheet")&&!e.target.closest("button,[data-say],summary"))return;
  {const tb=e.target.closest("[data-thf]");if(tb){const card=tb.closest(".trick");V.thf=tb.dataset.thf;const th=TH[card.dataset.lid];card.querySelector(".th-form").innerHTML=thForm(th,V.thf);card.querySelectorAll("[data-thf]").forEach(x=>x.setAttribute("aria-pressed",x===tb));return}}
  const b=e.target.closest("button,[data-say],summary,[data-act]");if(!b)return;
  const d=b.dataset;
  if(d.say!==undefined&&!d.act){speak(d.say,d.rate?+d.rate:undefined);if(V.screen==="run"&&sel)sel.heard=true;if(!d.setrate)return}
  if(d.setrate){S.rate=+d.rate;save();render();return}
  if(d.voice){S.voice=d.voice;save();render();speak(d.voice==="en-GB"?"Hello, this is the British voice.":"Hi, this is the American voice.");return}
  if(d.authmode){V.auth={mode:d.authmode,email:($("#au-email")||{}).value||(V.auth&&V.auth.email)};render();return}
  if(d.tab){if(V.screen==="home"&&V.tab===d.tab){window.scrollTo({top:0,behavior:"smooth"});return}go({screen:"home",tab:d.tab});return}
  if(d.goal){S.goal=+d.goal;save();render();return}
  if(d.mod){go({screen:"module",mod:d.mod});return}
  if(d.dk){V.dk=d.dk;render();return}
  if(d.dlg!==undefined){startDlg(+d.dlg);return}
  if(d.ch){V.thf="aff";go({screen:"chap",ch:d.ch});return}
  if(d.jump){const el=document.getElementById(d.jump);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-110,behavior:"smooth"});return}
  if(d.lesson){startLesson(d.lesson);return}
  if(d.splat!==undefined&&G&&G.on){const o=G.cur.opts[+d.splat];if(o===G.cur.it){G.score++;G.flash="ok"}else{G.miss++;G.flash="ko";toast(G.cur.it[0]+" = "+G.cur.it[1])}newRound();render();setTimeout(()=>{if(G)G.flash=null},360);return}
  if(V.screen==="run"&&!FB&&sel){
    const it=curItem();const q=it?it.q:null;
    if(q&&d.opt!==undefined){sel.j=+d.opt;if(q.t==="stress")speak(q.say);render();return}
    if(q&&d.pick!==undefined){sel.picked.push(+d.pick);render();return}
    if(q&&d.unpick!==undefined){sel.picked=sel.picked.filter(x=>x!==+d.unpick);render();return}
    if(q&&d.ml!==undefined){const k=+d.ml;if(sel.map[k]!=null){delete sel.map[k];sel.L=k}else sel.L=sel.L===k?null:k;render();return}
    if(q&&d.mr!==undefined){const r=+d.mr;const owner=Object.keys(sel.map).find(x=>sel.map[x]===r);if(owner!=null)delete sel.map[owner];if(sel.L!=null){sel.map[sel.L]=r;const nxt=q.pairs.findIndex((p,k)=>sel.map[k]==null);sel.L=nxt>=0?nxt:null}render();return}
  }
  switch(d.act){
    case "forgot":forgot();break;
    case "guest":signIn({uid:"guest",name:"",email:"",mode:"guest"},false);break;
    case "toregister":V.auth={mode:"register"};go({screen:"auth"});break;
    case "tologin":V.auth={mode:"login"};go({screen:"auth"});break;
    case "logout":signOut();break;
    case "method":go({screen:"method"});break;
    case "back":
      if(V.screen==="run")quitRun();
      else if(V.screen==="splat")go({screen:"home",tab:"rev"});
      else if(V.screen==="chap"||V.screen==="dlgs")go({screen:"home",tab:"tricks"});
      else if(V.screen==="cards"){CARDS=null;go({screen:"home",tab:"rev"})}
      else go({screen:"home"});break;
    case "askreset":V.sheet="reset";render();break;
    case "theory":V.sheet="theory";render();break;
    case "chapgo":startChap(V.ch);break;
    case "chapmore":startChap(RUN.id);break;
    case "closesheet":V.sheet=null;render();break;
    case "doresetrun":V.sheet=null;if(RUN.kind==="chap")startChap(RUN.id);else if(RUN.kind==="dlg")startDlg(RUN.id);else if(RUN.kind==="lesson")startLesson(RUN.id,true);else if(RUN.kind==="review")startReview();else startMix();break;
    case "trick-ok":S.les[RUN.id].run.trick=true;save();advance();break;
    case "next":advance();break;
    case "verify":verify();break;
    case "override":overrideOk();break;
    case "redo":if(RUN.kind==="dlg")startDlg(RUN.id);else startLesson(RUN.id,true);break;
    case "review":startReview();break;
    case "mix":startMix();break;
    case "splat":G=null;go({screen:"splat"});break;
    case "cards":startCards();break;
    case "dlgs":go({screen:"dlgs"});break;
    case "dshow":V.dshow=V.dshow===false;render();break;
    case "flip":if(CARDS&&!CARDS.show){CARDS.show=true;render()}break;
    case "cardyes":gradeCard(true);break;
    case "cardno":gradeCard(false);break;
    case "gstart":stopGame();startGame();break;
    case "export":CONF=CONF==="export"?null:"export";render();break;
    case "import":CONF=CONF==="import"?null:"import";render();break;
    case "reset":CONF=CONF==="reset"?null:"reset";render();break;
    case "cancel":CONF=null;render();break;
    case "doreset":S=blank();save();CONF=null;toast("Progressi azzerati");go({screen:"home",tab:"mods"});break;
    case "copycode":{const t=$("#code");const v=t.value;
      const ok=()=>toast("Codice copiato");const fb=()=>{t.focus();t.select();toast("Seleziona e copia il codice")};
      try{navigator.clipboard.writeText(v).then(ok,fb)}catch(err){fb()}break}
    case "doimport":{try{const v=JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim()))));if(!v||typeof v!=="object"||!v.les)throw 0;S=Object.assign(blank(),v);save();CONF=null;toast("Progressi importati");go({screen:"home",tab:"mods"})}catch(err){toast("Codice non valido: copialo di nuovo per intero")}break}
  }
});
document.addEventListener("submit",e=>{if(e.target.id==="authform"){e.preventDefault();submitAuth()}});
document.addEventListener("input",e=>{
  if(e.target.id==="ans"&&sel){const had=sel.text.trim().length>0;sel.text=e.target.value;const has=sel.text.trim().length>0;if(had!==has){const b=document.querySelector('[data-act="verify"]');if(b)b.disabled=!has}}
  if(e.target.id==="tq"){V.tq=e.target.value;const tmp=document.createElement("div");tmp.innerHTML=renderTricksTab();const nl=tmp.querySelector("#tklist");$("#tklist").innerHTML=nl?nl.innerHTML:""}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&V.sheet){V.sheet=null;render();return}
  if(V.screen==="cards"&&CARDS&&CARDS.pos<CARDS.deck.length){if(e.key===" "&&!CARDS.show){e.preventDefault();CARDS.show=true;render();return}if(CARDS.show&&(e.key==="1"||e.key==="2")){gradeCard(e.key==="2");return}}
  if(V.screen==="run"&&!FB&&!V.sheet&&/^[1-9]$/.test(e.key)&&!/INPUT|TEXTAREA/.test(e.target.tagName)){const o=document.querySelector(`[data-opt="${+e.key-1}"]`);if(o){o.click();return}}
  if(V.screen==="splat"&&G&&G.on&&/^[1-6]$/.test(e.key)){const o=document.querySelector(`[data-splat="${+e.key-1}"]`);if(o){o.click();return}}
  if(e.key!=="Enter"||V.screen!=="run"||V.sheet||e.target.tagName==="BUTTON")return;
  if(e.target.tagName==="TEXTAREA"&&!e.metaKey&&!e.ctrlKey&&!FB){e.preventDefault()}
  const b=document.querySelector('[data-act="verify"]:not([disabled]),.dock [data-act="next"],.dock [data-act="trick-ok"]');
  if(b){e.preventDefault();b.click()}
});

initTabbar();
boot();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
