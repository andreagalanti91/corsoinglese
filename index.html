{ id:"m3", color:"purple", icon:"flag", title:"Roadmap e piani", tag:"Futuro", sub:"Piani, scadenze, ipotesi e proposte per il prossimo sprint.",
  lessons:[
  { id:"m3l1", h:"WILL decide, GOING TO pianifica", min:8,
    tip:"Decidi adesso o prometti → **will**. È già un piano → **going to**. È in calendario con un orario → **BE + -ing**.",
    formula:[["Chi","blue"],["will / 'm going to","purple"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["I","'ll","send","you the Figma link."],["We","'re going to","test","the prototype next week."],["It","won't","take","long."]],
    extra:"In calendario: *We==’re presenting== to the client on Friday at 3.* Dopo *will* niente *to*: *I'll ==send==*, mai *I'll to send*.",
    trap:["I will to send it tomorrow.","I'll send it tomorrow."],
    q:[
    {t:"choice",p:"OK, I ___ send you the link after the call.",o:["will","am going to"],a:0,x:"Decisione presa adesso → *will*."},
    {t:"choice",p:"We decided last month: we ___ move to a new design system.",o:["will","are going to"],a:1,x:"Piano già deciso → *going to*."},
    {t:"choice",p:"We ___ to the client on Friday at 3. (in calendario)",o:["present","are presenting","will presenting"],a:1,x:"Appuntamento → BE + -ing."},
    {t:"gap",p:"Don't worry, it ___ take long. (negativa)",a:["won't","will not"],x:"*will not* → *won't*."},
    {t:"order",p:"Testeremo il prototipo la settimana prossima.",w:["We","are","going","to","test","the","prototype","next","week."],x:"Piano: *are going to* + verbo nudo."},
    {t:"fix",p:"I will to update the file tonight.",a:["I'll update the file tonight."],x:"Dopo *will* niente *to*."},
    {t:"dict",say:"I'll send you the Figma link after the call.",x:"*I'll* suona quasi come *all*."},
    {t:"shadow",say:"We're going to launch the beta in two weeks.",it:"Lanceremo la beta tra due settimane."}]},
  { id:"m3l2", h:"Entro la scadenza: WILL HAVE", min:8,
    tip:"Una cosa che sarà **finita entro** una scadenza: **will have + participio**. Una cosa che sarà **in corso** in un momento futuro: **will be + -ing**. Perfetti per roadmap e stime.",
    formula:[["By + scadenza","indigo"],["Chi","blue"],["will have","purple"],["participio","orange"],["Resto","green"]],
    rows:[["By Q3,","we","'ll have","launched","the design system."],["By Friday,","I","'ll have","finished","the wireframes."],["This time tomorrow,","I","'ll be","presenting","to the board."]],
    extra:"Parole spia: *by Friday, by the end of the sprint, by Q3* → *will have*. *This time next week, at 10 tomorrow* → *will be + -ing*.",
    trap:["By Q3 we will have launch the app.","By Q3 we'll have launched the app."],
    q:[
    {t:"choice",p:"By the end of the sprint we ___ the new flow.",o:["will have tested","will testing","have tested"],a:0,x:"*by* + scadenza → *will have* + participio."},
    {t:"gap",p:"By Friday, I ___ (finish) the wireframes.",a:["will have finished","'ll have finished"],x:"*will have* + *finished*."},
    {t:"gap",p:"This time tomorrow, I ___ (present) to the board.",a:["will be presenting","'ll be presenting"],x:"In corso in quel momento → *will be* + -ing."},
    {t:"choice",p:"By Q3 the team ___ 40 components.",o:["will have built","will be build","builds"],a:0,x:"*build → built*."},
    {t:"choice",p:"Don't call me at 10: I ___ a user interview.",o:["'ll be running","'ll have run","run"],a:0,x:"Alle 10 sarà in corso → *will be running*."},
    {t:"order",p:"Entro lunedì avremo sistemato tutti i bug.",w:["By","Monday","we","will","have","fixed","all","the","bugs."],x:"*By* + *will have fixed*."},
    {t:"fix",p:"By Q3 we will have launch the app.",a:["By Q3 we'll have launched the app."],x:"Dopo *have* serve il participio: *launched*."}]},
  { id:"m3l3", h:"IF e WHEN: dopo, presente", min:8,
    tip:"Dopo **if**, **when**, **as soon as**, **before**, **after** usi il **presente**, anche se parli di futuro. Il *will* va nell'altra metà della frase.",
    formula:[["If / When","indigo"],["presente","orange"],["→","gray"],["will + verbo","purple"]],
    rows:[["If","the test fails,","→","we'll iterate."],["When","I finish,","→","I'll send it."],["As soon as","the client replies,","→","we'll start."]],
    extra:"L'ordine si può invertire, la regola no: *We'll start ==as soon as== the client ==replies==.* Ipotesi poco probabile: *If we ==had== more time, we ==would== test more.*",
    trap:["When I will finish, I call you.","When I finish, I'll call you."],
    q:[
    {t:"choice",p:"I'll call you when I ___.",o:["finish","will finish"],a:0,x:"Dopo *when* → presente."},
    {t:"gap",p:"If the test ___ (fail), we'll iterate.",a:["fails"],x:"Dopo *if* → presente (con la S: *the test* = it)."},
    {t:"gap",p:"If users like it, we ___ (roll) it out to everyone.",a:["will roll","'ll roll"],x:"L'altra metà vuole *will*."},
    {t:"choice",p:"We'll start as soon as the client ___.",o:["replies","will reply","reply"],a:0,x:"*as soon as* + presente; *the client* → *replies*."},
    {t:"choice",p:"If we had more budget, we ___ hire a researcher.",o:["would","will"],a:0,x:"Ipotesi poco probabile → *had … would*."},
    {t:"order",p:"Se approvi oggi, iniziamo lunedì.",w:["If","you","approve","today,","we'll","start","on","Monday."],x:"*If* + presente, poi *will*."},
    {t:"fix",p:"If the test will fail, we iterate.",a:["If the test fails, we'll iterate."],x:"Niente *will* dopo *if*; il *will* va nell'altra metà."}]},
  { id:"m3l4", h:"Proporre: should, could, might", min:8,
    tip:"Dopo **can, could, should, might, must** c'è sempre il **verbo nudo**: niente *to*, niente *S*, niente *do*. Scegli il modale in base a quanto sei sicuro.",
    formula:[["Chi","blue"],["should / could / might","purple"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["We","should","simplify","the checkout."],["We","could","try","a bottom sheet."],["It","might","confuse","new users."]],
    extra:"Scala di certezza: *will* (sicuro) → *should* (probabile) → *may / might / could* (forse). Obbligo esterno: *We ==have to== follow the brand guidelines*. Non serve: *You ==don't have to== join*.",
    trap:["We should to test it.","We should test it."],
    q:[
    {t:"choice",p:"We should ___ it with real users.",o:["test","to test","testing"],a:0,x:"Modale + verbo nudo."},
    {t:"choice",p:"Consiglio: “Dovremmo semplificare il form”",o:["We should simplify the form.","We must to simplify the form.","We would simplify the form."],a:0,x:"Consiglio → *should*."},
    {t:"choice",p:"Forse: “Potrebbe confondere i nuovi utenti”",o:["It might confuse new users.","It must confuse new users.","It mights confuse new users."],a:0,x:"Possibilità → *might*, senza S."},
    {t:"choice",p:"You ___ join the call: it's optional.",o:["mustn't","don't have to"],a:1,x:"Non necessario → *don't have to*. *Mustn't* = è vietato."},
    {t:"choice",p:"Qual è corretta?",o:["Do you can share your screen?","Can you share your screen?","Can you to share your screen?"],a:1,x:"Niente *do*, niente *to*."},
    {t:"order",p:"Potremmo provare un bottom sheet.",w:["We","could","try","a","bottom","sheet."],x:"*could* + verbo nudo."},
    {t:"fix",p:"She cans join the review.",a:["She can join the review."],x:"I modali non prendono la S."},
    {t:"shadow",say:"We could try a bottom sheet here. It might work better on mobile.",it:"Qui potremmo provare un bottom sheet. Potrebbe funzionare meglio su mobile."}]},
  { id:"m3l5", h:"Sfida: presenta la roadmap", min:10, final:true,
    tip:"Sei frasi da roadmap: piani, scadenze, condizioni e proposte.",
    q:[
    {t:"trans",p:"Lunedì presentiamo al cliente. (in calendario)",a:["We're presenting to the client on Monday.","On Monday we're presenting to the client."]},
    {t:"trans",p:"Quando finisco, ti chiamo.",a:["When I finish, I'll call you.","I'll call you when I finish."]},
    {t:"trans",p:"Non ci vorrà molto.",a:["It won't take long."]},
    {t:"trans",p:"Potremmo provare un bottom sheet.",a:["We could try a bottom sheet."]},
    {t:"trans",p:"Non devi partecipare: è facoltativo.",a:["You don't have to join: it's optional.","You don't have to come: it's optional.","You don't have to attend: it's optional."]},
    {t:"trans",p:"Entro il Q3 avremo lanciato il nuovo sito.",a:["By Q3 we'll have launched the new website.","By Q3 we'll have launched the new site.","We'll have launched the new website by Q3."]},
    {t:"trans",p:"Ti mando il link dopo la call.",a:["I'll send you the link after the call.","I'll send the link to you after the call."]},
    {t:"trans",p:"Testeremo il prototipo la settimana prossima.",a:["We're going to test the prototype next week.","We'll test the prototype next week.","We're testing the prototype next week."]},
    {t:"trans",p:"Entro venerdì avrò finito i wireframe.",a:["By Friday I'll have finished the wireframes.","I'll have finished the wireframes by Friday."]},
    {t:"trans",p:"Se il test fallisce, iteriamo.",a:["If the test fails, we'll iterate.","If the test fails, we iterate."]},
    {t:"trans",p:"Dovremmo semplificare il checkout.",a:["We should simplify the checkout."]},
    {t:"trans",p:"Potrebbe confondere gli utenti.",a:["It might confuse users.","It might confuse the users.","It could confuse users.","It could confuse the users.","It may confuse users.","It may confuse the users."]}]} ] },

/* ---------------- MODULO 4 ---------------- */
{ id:"m4", color:"teal", icon:"grid", title:"Il lessico UI", tag:"Vocabolario", sub:"Componenti, verbi del mestiere, falsi amici e aggettivi per il feedback.",
  lessons:[
  { id:"m4l1", h:"I componenti dell'interfaccia", min:8,
    tip:"Impara i nomi dei componenti **guardando il componente**, non la traduzione: forma + parola si ricordano meglio insieme (*dual coding*). Gli sviluppatori usano proprio questi nomi.",
    vocab:[["toggle / switch","interruttore on/off"],["checkbox","casella: più scelte possibili"],["radio button","una sola scelta tra tante"],["dropdown","menu a tendina"],["modal","finestra sopra la pagina, blocca il resto"],["toast","messaggio breve che appare e sparisce"],["tooltip","fumetto di aiuto su un elemento"],["tab bar","barra di schede in basso"],["breadcrumb","percorso: Home › Shop › Shoes"]],
    extra:"I verbi giusti: *==tap== a button* (mobile), *==click== a link* (desktop), *==check== a box*, *==toggle== a switch*, *==swipe== a card*, *==drag== a slider*.",
    trap:["Flag the option.","Check the box."],
    q:[
    {t:"ui",k:"toggle",p:"Come si chiama questo componente?",o:["checkbox","toggle","slider"],a:1,x:"*Toggle* (o *switch*): on/off immediato."},
    {t:"ui",k:"checkbox",p:"E questo?",o:["checkbox","radio button","toggle"],a:0,x:"*Checkbox*: puoi spuntarne più di una."},
    {t:"ui",k:"radio",p:"Una sola scelta possibile:",o:["checkboxes","radio buttons","dropdown"],a:1,x:"*Radio buttons*: una sola opzione attiva."},
    {t:"ui",k:"toast",p:"Il messaggio in basso è un…",o:["modal","tooltip","toast"],a:2,x:"*Toast*: breve, non blocca, sparisce da solo."},
    {t:"ui",k:"dropdown",p:"Come si chiama?",o:["dropdown","breadcrumb","tab bar"],a:0,x:"*Dropdown* (o *select*)."},
    {t:"ui",k:"breadcrumb",p:"Il percorso in alto è un…",o:["breadcrumb","stepper","pagination"],a:0,x:"*Breadcrumb*: le briciole di pane di Pollicino."},
    {t:"ui",k:"modal",p:"La finestra al centro è un…",o:["toast","modal","card"],a:1,x:"*Modal* (o *dialog*): blocca la pagina finché non scegli."},
    {t:"ui",k:"tooltip",p:"Il fumetto nero è un…",o:["badge","toast","tooltip"],a:2,x:"*Tooltip*: aiuto contestuale."},
    {t:"ui",k:"tabbar",p:"La barra in basso è una…",o:["tab bar","navigation drawer","toolbar"],a:0,x:"*Tab bar*: le sezioni principali dell'app."},
    {t:"choice",p:"“Flagga l'opzione” in inglese:",o:["Flag the option.","Check the box.","Flagger the box."],a:1,x:"In inglese una casella si *check* (UK anche *tick*)."}]},
  { id:"m4l2", h:"Phrasal verbs del designer", min:8,
    tip:"I phrasal verbs sono **verbo + particella**, e la particella cambia tutto: *roll out* = rilasciare gradualmente, *figure out* = capire. Imparali **dentro una frase intera** (*chunk*), mai da soli.",
    vocab:[["roll out","rilasciare (gradualmente)"],["come up with","inventare, proporre un'idea"],["figure out","capire, risolvere"],["set up","configurare, organizzare"],["follow up","ricontattare, dare seguito"],["sign off on","approvare formalmente"],["ship","rilasciare in produzione"],["iterate","fare una versione migliorata"]],
    extra:"Con un pronome la particella va dopo: *figure ==it out==*, *set ==it up==*, mai *figure out it*.",
    trap:["I'll follow you up by email.","I'll follow up by email."],
    q:[
    {t:"match",p:"Abbina il phrasal verb al significato.",pairs:[["roll out","rilasciare gradualmente"],["figure out","capire, risolvere"],["come up with","proporre un'idea"],["sign off on","approvare"]],x:"Imparali nella frase: *We rolled out the new nav.*"},
    {t:"choice",p:"We need to ___ a better name for this feature.",o:["come up with","roll out","set up"],a:0,x:"Trovare un'idea → *come up with*."},
    {t:"choice",p:"We'll ___ the new navigation to 10% of users first.",o:["roll out","figure out","follow up"],a:0,x:"Rilascio graduale → *roll out*."},
    {t:"gap",p:"Let's ___ up a call with the devs.",a:["set"],x:"Organizzare → *set up*."},
    {t:"gap",p:"I'll follow ___ by email after the meeting.",a:["up"],x:"*follow up*."},
    {t:"choice",p:"Non capisci il bug: “I can't ___.”",o:["figure it out","figure out it","figure it"],a:0,x:"Pronome in mezzo: *figure it out*."},
    {t:"order",p:"Il cliente deve approvare il design.",w:["The","client","has","to","sign","off","on","the","design."],x:"*sign off on* + cosa."},
    {t:"fix",p:"I can't figure out it.",a:["I can't figure it out."],x:"Con *it* la particella va dopo."}]},
  { id:"m4l3", h:"I falsi amici del designer", min:8,
    tip:"Alcune parole sembrano italiane ma significano altro. I più pericolosi in riunione: **actually** = in realtà (non *attualmente*), **eventually** = alla fine (non *eventualmente*), **realize** = rendersi conto (non *realizzare un'app*).",
    vocab:[["actually","in realtà · attualmente = currently"],["eventually","alla fine · eventualmente = if needed"],["realize","rendersi conto · realizzare = build, make"],["consistent","coerente, uniforme · consistente = solid"],["control","comandare · controllare = check"],["attend","partecipare a · assistere = help"],["sensible","sensato · sensibile = sensitive"],["argument","litigio · argomento = topic"]],
    extra:"Per *realizzare* scegli tra *build, make, create, design, deliver*. Per *controllare*: *check, review, test*.",
    trap:["We realized a new app.","We built a new app."],
    q:[
    {t:"choice",p:"“Attualmente lavoro su un'app bancaria”",o:["Actually I work on a banking app.","Currently I'm working on a banking app.","Actually I'm working on a banking app."],a:1,x:"*Attualmente* = *currently*. *Actually* = in realtà."},
    {t:"choice",p:"“Eventualmente aggiungiamo un filtro” (se serve)",o:["Eventually we add a filter.","If needed, we can add a filter.","Eventual we add a filter."],a:1,x:"*Eventually* = alla fine. *Eventualmente* = *if needed*."},
    {t:"choice",p:"“Abbiamo realizzato un nuovo sito”",o:["We realized a new website.","We built a new website."],a:1,x:"*Realize* = rendersi conto."},
    {t:"choice",p:"“Puoi controllare il file?”",o:["Can you control the file?","Can you check the file?"],a:1,x:"*Control* = comandare."},
    {t:"choice",p:"“Le icone non sono coerenti”",o:["The icons aren't consistent.","The icons aren't solid."],a:0,x:"Nel design *consistent* = coerente, uniforme."},
    {t:"choice",p:"“Ho partecipato alla conferenza”",o:["I assisted the conference.","I attended the conference."],a:1,x:"*Attend* = partecipare."},
    {t:"choice",p:"“I dati degli utenti sono sensibili”",o:["User data is sensible.","User data is sensitive."],a:1,x:"*Sensible* = sensato."},
    {t:"fix",p:"Actually we're working on version 2. (intendi “attualmente”)",a:["Currently we're working on version 2.","We're currently working on version 2.","At the moment we're working on version 2.","Right now we're working on version 2."],x:"*Attualmente* = *currently / at the moment*."}]},
  { id:"m4l4", h:"Aggettivi per il feedback", min:8,
    tip:"Per confrontare due proposte: aggettivo corto + **-er than** (*cleaner than*), lungo con **more … than** (*more consistent than*). Il migliore: **the -est / the most**.",
    formula:[["Option B","blue"],["is","orange"],["cleaner / more intuitive","pink"],["than option A","green"]],
    rows:[["Option B","is","cleaner","than option A."],["This flow","is","more intuitive","than the old one."],["Version 3","is","the most accessible","of all."]],
    extra:"Coppie di contrari: *clean ↔ ==cluttered==, consistent ↔ ==inconsistent==, bold ↔ ==subtle==, readable ↔ ==hard to read==*. Irregolari: *good → ==better== → the best*, *bad → ==worse== → the worst*.",
    trap:["Option B is more clear of option A.","Option B is clearer than option A."],
    q:[
    {t:"gap",p:"Option B is ___ (clean) than option A.",a:["cleaner"],x:"Aggettivo corto: +er."},
    {t:"gap",p:"The new flow is ___ intuitive than the old one.",a:["more"],x:"Aggettivo lungo: *more*."},
    {t:"gap",p:"This is the ___ (good) version so far.",a:["best"],x:"*good → better → the best*."},
    {t:"choice",p:"Il contrario di *clean* (riferito a un'interfaccia):",o:["cluttered","bold","subtle"],a:0,x:"*Cluttered* = troppo pieno, disordinato."},
    {t:"match",p:"Abbina l'aggettivo al significato.",pairs:[["cluttered","pieno, disordinato"],["subtle","discreto, sottile"],["consistent","coerente"],["readable","leggibile"]],x:"Il lessico base di ogni design critique."},
    {t:"choice",p:"The contrast is ___ than before: we need to fix it.",o:["worse","badder","more bad"],a:0,x:"*bad → worse → the worst*."},
    {t:"fix",p:"This layout is more simple than the old one.",a:["This layout is simpler than the old one."],x:"*simple* è corto: *simpler*."}]},
  { id:"m4l5", h:"Sfida: il lessico in azione", min:10, final:true,
    tip:"Sei frasi con il lessico del modulo: componenti, phrasal verbs, falsi amici e confronti.",
    q:[
    {t:"trans",p:"Trascina il cursore per cambiare il volume.",a:["Drag the slider to change the volume."]},
    {t:"trans",p:"Dobbiamo trovare un nome migliore.",a:["We need to come up with a better name.","We have to come up with a better name.","We need to find a better name."]},
    {t:"trans",p:"Alla fine abbiamo scelto la versione B.",a:["Eventually we chose version B.","In the end we chose version B.","We eventually chose version B.","Finally we chose version B."]},
    {t:"trans",p:"Ho partecipato a un workshop sull'accessibilità.",a:["I attended an accessibility workshop.","I attended a workshop on accessibility.","I attended a workshop about accessibility."]},
    {t:"trans",p:"Questo layout è più semplice di quello vecchio.",a:["This layout is simpler than the old one."]},
    {t:"trans",p:"L'interfaccia è troppo piena.",a:["The interface is too cluttered.","The UI is too cluttered.","The interface is too busy."]},
    {t:"trans",p:"Spunta la casella per accettare.",a:["Check the box to accept.","Tick the box to accept.","Check the checkbox to accept."]},
    {t:"trans",p:"Rilasceremo la funzione gradualmente.",a:["We'll roll out the feature gradually.","We're going to roll out the feature gradually.","We'll roll the feature out gradually."]},
    {t:"trans",p:"Attualmente sto lavorando a una libreria di componenti.",a:["I'm currently working on a component library.","Currently I'm working on a component library.","At the moment I'm working on a component library."]},
    {t:"trans",p:"Le icone non sono coerenti.",a:["The icons aren't consistent.","The icons are not consistent."]},
    {t:"trans",p:"L'opzione B è più pulita dell'opzione A.",a:["Option B is cleaner than option A."]},
    {t:"trans",p:"Puoi controllare il prototipo?",a:["Can you check the prototype?","Could you check the prototype?","Can you review the prototype?","Could you review the prototype?"]}]} ] },

/* ---------------- MODULO 5 ---------------- */
{ id:"m5", color:"pink", icon:"chat", title:"Design critique e meeting", tag:"Speaking", sub:"Dare opinioni, interrompere, essere in disaccordo con garbo e chiudere la call.",
  lessons:[
  { id:"m5l1", h:"Dare un'opinione (e ammorbidirla)", min:8,
    tip:"Per un'opinione negativa, in inglese **neghi il think**: *I ==don't think== it works*, non *I think it doesn't work*. Ammorbidisci le critiche con **maybe, a bit, I wonder if**.",
    formula:[["I think / I don't think","purple"],["soggetto + verbo","blue"],["(ammorbidente)","green"]],
    rows:[["I think","the hierarchy works","really well."],["I don't think","the icon is","clear enough."],["I wonder if","we could make it","a bit bigger."]],
    extra:"Altre aperture: *In my opinion… · I believe… · From a user's point of view… · My concern is that…* Ammorbidenti: *a bit, slightly, maybe, perhaps*.",
    trap:["I think it doesn't work.","I don't think it works."],
    q:[
    {t:"choice",p:"Quale è più naturale?",o:["I think the label isn't clear.","I don't think the label is clear."],a:1,x:"Si nega il *think*."},
    {t:"choice",p:"Ammorbidisci: “Il testo è piccolo”",o:["The text is small.","The text is maybe a bit small.","The text is smallest."],a:1,x:"*maybe a bit* rende la critica gentile."},
    {t:"gap",p:"I ___ think the green works in dark mode. (negativa)",a:["don't","do not"],x:"*I don't think* + frase affermativa."},
    {t:"gap",p:"I ___ if we could try a different icon.",a:["wonder"],x:"*I wonder if…* = mi chiedo se…"},
    {t:"order",p:"Dal punto di vista dell'utente, è confuso.",w:["From","a","user's","point","of","view,","it's","confusing."],x:"Apertura da UX: *From a user's point of view*."},
    {t:"order",p:"La mia preoccupazione è che sia troppo lungo.",w:["My","concern","is","that","it's","too","long."],x:"*My concern is that…*"},
    {t:"fix",p:"In my opinion is too dark.",a:["In my opinion, it's too dark."],x:"Il soggetto non si omette mai: *it's*."},
    {t:"shadow",say:"I really like the layout, but I wonder if the button could be a bit bigger.",it:"Il layout mi piace molto, ma mi chiedo se il bottone potrebbe essere un po' più grande."}]},
  { id:"m5l2", h:"Interrompere e chiarire", min:8,
    tip:"Interrompere con educazione è una skill: usa una **formula pronta** + la tua domanda. Non costruire la frase da zero: impara il blocco intero.",
    formula:[["Formula pronta","purple"],["la tua domanda","green"]],
    rows:[["Sorry to interrupt, but","can I ask something?"],["Could I stop you there?","I have a question."],["Just to clarify,","do you mean the mobile version?"],["What do you mean by","“more premium”?"]],
    extra:"Se non hai capito: *Could you ==say that again==, please? · Could you ==slow down== a bit? · Sorry, I ==didn't catch== that.*",
    trap:["Can you repeat me?","Could you say that again?"],
    q:[
    {t:"choice",p:"Non hai capito l'ultima frase:",o:["Sorry, I didn't catch that.","Sorry, I didn't take that.","Sorry, I don't catch."],a:0,x:"*I didn't catch that* = non ho capito/sentito."},
    {t:"gap",p:"Sorry to ___, but can I ask a question?",a:["interrupt"],x:"*Sorry to interrupt, but…*"},
    {t:"gap",p:"Just to ___, do you mean the desktop version?",a:["clarify"],x:"*Just to clarify…* = giusto per chiarire."},
    {t:"choice",p:"Il cliente dice “make it pop”. Chiedi cosa intende:",o:["What do you mean by “pop”?","What do you intend with “pop”?","What means “pop”?"],a:0,x:"*What do you mean by…?*"},
    {t:"choice",p:"Parla troppo veloce:",o:["Could you slow down a bit?","Could you go more slow?","Can you speak more piano?"],a:0,x:"*slow down* = rallentare."},
    {t:"order",p:"Posso fermarti un attimo?",w:["Could","I","stop","you","there?"],x:"Formula pronta per interrompere."},
    {t:"fix",p:"Can you repeat me the last part?",a:["Can you repeat the last part?","Could you repeat the last part?"],x:"*repeat* non vuole *me*."},
    {t:"dict",say:"Sorry, could you say that again, please?",x:"Formula da imparare a memoria."}]},
  { id:"m5l3", h:"D'accordo e non d'accordo", min:8,
    tip:"**Agree** è un verbo: *I agree*, mai *I'm agree*. Per non essere d'accordo senza scontri: prima **riconosci** il punto dell'altro, poi **but** e la tua motivazione.",
    formula:[["Riconosci","green"],["but","orange"],["la tua idea","blue"]],
    rows:[["I see your point,","but","users need a shortcut."],["That's a good idea,","but","it might slow us down."],["I agree with you,","but","let's test it first."]],
    extra:"Accordo pieno: *Absolutely. · Exactly. · I couldn't agree more.* Disaccordo morbido: *I'm not sure I agree. · I see it a bit differently.*",
    trap:["I'm agree with you.","I agree with you."],
    q:[
    {t:"choice",p:"“Sono d'accordo”",o:["I'm agree.","I agree.","I'm agreed with."],a:1,x:"*agree* è un verbo: niente *am*."},
    {t:"choice",p:"Disaccordo gentile:",o:["You're wrong.","I see your point, but I'm not sure it works on mobile.","No, is bad."],a:1,x:"Riconosci → *but* → motivazione."},
    {t:"gap",p:"I couldn't agree ___.",a:["more"],x:"*I couldn't agree more* = sono assolutamente d'accordo."},
    {t:"gap",p:"I ___ your point, but we don't have time.",a:["see"],x:"*I see your point* = capisco il tuo punto."},
    {t:"order",p:"Non sono sicuro di essere d'accordo.",w:["I'm","not","sure","I","agree."],x:"Disaccordo morbido."},
    {t:"choice",ctx:"**Cliente:** “Can we make the logo bigger? Like, much bigger?”",p:"Qual è la risposta più professionale?",o:["No, it's ugly.","I see why you want more visibility, but a bigger logo might push the main action below the fold.","OK, I make it bigger."],a:1,x:"Riconosci → *but* → motivazione da UX."},
    {t:"fix",p:"I'm not agree with the new colors.",a:["I don't agree with the new colors.","I disagree with the new colors."],x:"Negativa di un verbo: *don't agree*."}]},
  { id:"m5l4", h:"Chiudere la riunione", min:8,
    tip:"Una buona call finisce con **riassunto + prossimi passi + chi fa cosa**. Tre formule bastano: *To sum up…*, *The next step is…*, *I'll follow up by email.*",
    formula:[["To sum up / In summary","purple"],["decisione","blue"],["next step + chi","green"]],
    rows:[["To sum up,","we keep the tab bar","and Marco fixes the icons."],["In summary,","we test version B","next week."],["So the next step is","a quick prototype","by Friday."]],
    extra:"Rimandare: *Let's ==take this offline==* (ne parliamo dopo, in pochi). Scadenze: *==by== Friday* = entro venerdì; *==until== Friday* = fino a venerdì.",
    trap:["We send it within Friday.","We'll send it by Friday."],
    q:[
    {t:"choice",p:"“Entro venerdì”",o:["within Friday","by Friday","until Friday"],a:1,x:"Scadenza → *by*."},
    {t:"gap",p:"To ___ up, we keep the current navigation.",a:["sum"],x:"*To sum up* = riassumendo."},
    {t:"gap",p:"I'll ___ up by email with the notes.",a:["follow"],x:"*follow up* = dare seguito."},
    {t:"choice",p:"Un tema lungo che riguarda solo due persone:",o:["Let's take this offline.","Let's go out.","Let's put it outside."],a:0,x:"*take this offline* = parliamone a parte."},
    {t:"order",p:"Il prossimo passo è un prototipo veloce.",w:["The","next","step","is","a","quick","prototype."],x:"*The next step is…*"},
    {t:"choice",ctx:"**PM:** “So, who's doing what?”",p:"Rispondi in modo chiaro:",o:["I'll update the flow and share it by Thursday.","I update the flow and I share within Thursday.","The flow will be updated maybe."],a:0,x:"Chi + *will* + cosa + *by* + quando."},
    {t:"fix",p:"We meet again the next week.",a:["We'll meet again next week.","Let's meet again next week.","We meet again next week."],x:"*next week* senza *the*."},
    {t:"shadow",say:"To sum up, we keep version B. I'll update the prototype and share it by Friday.",it:"Riassumendo, teniamo la versione B. Aggiorno il prototipo e lo condivido entro venerdì."}]},
  { id:"m5l5", h:"Sfida: la design review", min:10, final:true,
    tip:"Sei frasi da design review: opinione, interruzione, disaccordo e chiusura.",
    q:[
    {t:"trans",p:"Dal punto di vista dell'utente, è confuso.",a:["From a user's point of view, it's confusing.","From the user's point of view, it's confusing."]},
    {t:"trans",p:"Scusa, non ho capito.",a:["Sorry, I didn't catch that.","Sorry, I didn't understand.","Sorry, I didn't get that."]},
    {t:"trans",p:"Puoi rallentare un po'?",a:["Could you slow down a bit?","Can you slow down a bit?","Could you slow down a little?"]},
    {t:"trans",p:"Non sono d'accordo con i nuovi colori.",a:["I don't agree with the new colors.","I disagree with the new colors."]},
    {t:"trans",p:"Riassumendo, teniamo la versione B.",a:["To sum up, we keep version B.","To sum up, we're keeping version B.","In summary, we keep version B."]},
    {t:"trans",p:"Ne parliamo dopo, a parte.",a:["Let's take this offline.","Let's talk about it later.","Let's discuss it later."]},
    {t:"trans",p:"Non penso che l'icona sia chiara.",a:["I don't think the icon is clear.","I don't think the icon is clear enough."]},
    {t:"trans",p:"Scusa se ti interrompo, ma posso fare una domanda?",a:["Sorry to interrupt, but can I ask a question?","Sorry to interrupt, but could I ask a question?","Sorry for interrupting, but can I ask a question?"]},
    {t:"trans",p:"Cosa intendi con “più premium”?",a:["What do you mean by “more premium”?"]},
    {t:"trans",p:"Sono d'accordo, ma testiamolo prima.",a:["I agree, but let's test it first."]},
    {t:"trans",p:"Capisco il tuo punto, ma non abbiamo tempo.",a:["I see your point, but we don't have time.","I see your point, but we don't have the time."]},
    {t:"trans",p:"Ti mando le note entro venerdì.",a:["I'll send you the notes by Friday.","I'll send the notes by Friday.","I'll send the notes to you by Friday."]}]} ] },

{ id:"m6", color:"blue", icon:"wave", title:"Pronuncia e ascolto", tag:"Phonology", sub:"Accento delle parole, coppie minime, dettati e uno stand-up vero.",
  lessons:[
  { id:"m6l1", h:"L'accento delle parole", min:8,
    tip:"In inglese **una sillaba per parola è forte**, le altre quasi spariscono. Sbagliare l'accento confonde più che sbagliare un suono. Qui ci sono le parole del design che gli italiani sbagliano di più.",
    vocab:[["PRO·to·type","non pro-to-TI-pe"],["de·SIGN","la g non si sente: di-ZAIN"],["us·a·BIL·i·ty","accento sulla terza"],["IN·ter·face","accento sulla prima"],["de·VEL·op·er","non de-ve-LO-per"],["ty·POG·ra·phy","ti-PO-gra-fi"],["an·a·LYT·ics","accento su LYT"],["ac·CES·si·ble","accento sulla seconda"]],
    extra:"Trucco nomi/verbi: *a ==RE==cord* (nome) ma *to re==CORD==* (verbo); *a ==PRE==sent* (regalo) ma *to pre==SENT==* (presentare).",
    trap:["de-ve-LO-per","de-VEL-op-er"],
    q:[
    {t:"stress",say:"prototype",s:["pro","to","type"],a:0,x:"*PRO-to-type*."},
    {t:"stress",say:"developer",s:["de","vel","op","er"],a:1,x:"*de-VEL-op-er*."},
    {t:"stress",say:"usability",s:["us","a","bil","i","ty"],a:2,x:"*us-a-BIL-i-ty*."},
    {t:"stress",say:"interface",s:["in","ter","face"],a:0,x:"*IN-ter-face*."},
    {t:"stress",say:"typography",s:["ty","pog","ra","phy"],a:1,x:"*ty-POG-ra-phy*."},
    {t:"stress",say:"analytics",s:["an","a","lyt","ics"],a:2,x:"*an-a-LYT-ics*."},
    {t:"stress",say:"accessible",s:["ac","ces","si","ble"],a:1,x:"*ac-CES-si-ble*."},
    {t:"choice",p:"*to present* (verbo, presentare): dov'è l'accento?",o:["PRE-sent","pre-SENT"],a:1,x:"Verbo → accento sulla seconda."}]},
  { id:"m6l2", h:"Coppie minime", min:8,
    tip:"Due parole che cambiano per **un solo suono**: *ship / sheep*, *live / leave*. Ascolta, scegli, ripeti a voce alta. È l'attività di fonetica che la guida consiglia di più.",
    vocab:[["ship · sheep","i corta · i lunga"],["live · leave","vivere · andare via"],["fill · feel","riempire · sentire"],["full · fool","pieno · sciocco"],["work · walk","lavorare · camminare"],["bug · bag","bug · borsa"],["test · taste","test · gusto"]],
    extra:"La *i* corta (*ship, live, fill*) è rilassata e breve. La *ee* lunga (*sheep, leave, feel*) si fa sorridendo e tenendo il suono.",
    trap:["We need to fix this bag.","We need to fix this bug."],
    q:[
    {t:"listen",say:"leave",o:["live","leave"],a:1,x:"*leave* = i lunga."},
    {t:"listen",say:"ship",o:["ship","sheep"],a:0,x:"*ship* = i corta."},
    {t:"listen",say:"walk",o:["work","walk"],a:1,x:"*walk*: la l non si sente."},
    {t:"listen",say:"bug",o:["bug","bag"],a:0,x:"*bug*: suono breve e chiuso."},
    {t:"listen",say:"full",o:["full","fool"],a:0,x:"*full* = u corta."},
    {t:"listen",say:"taste",o:["test","taste"],a:1,x:"*taste* = suono *ei*."},
    {t:"listen",say:"feel",o:["fill","feel"],a:1,x:"*feel* = i lunga."},
    {t:"listen",say:"seat",o:["sit","seat"],a:1,x:"*seat* = i lunga."}]},
  { id:"m6l3", h:"Dettato da riunione", min:10,
    tip:"Il dettato allena orecchio e scrittura insieme. Ascolta **una volta per il senso**, la seconda **per le parole**. Le parole piccole (*to, the, a, of*) quasi spariscono: sono le prime da cercare.",
    formula:[["1° ascolto","blue"],["2° ascolto","purple"],["Controlla","green"]],
    rows:[["il senso","le parole","le parole piccole"]],
    extra:"Forme deboli: *to* suona *tə*, *and* suona *n*, *can* suona *kən*. Nel parlato veloce *want to* diventa *wanna* e *going to* diventa *gonna*.",
    trap:["I wanna to share my screen.","I want to share my screen."],
    q:[
    {t:"dict",say:"Can you see my screen?",x:"La domanda che fai in ogni call."},
    {t:"dict",say:"Let's start with the user flow.",x:"*Let's* = *let us*."},
    {t:"dict",say:"The button is too small on mobile.",x:"*too* = troppo."},
    {t:"dict",say:"We need to fix the contrast.",x:"*need to* + verbo."},
    {t:"dict",say:"I'm going to share the prototype.",x:"*going to* si pronuncia quasi *gonna*."},
    {t:"dict",say:"What do you think about the colors?",a:["What do you think about the colors?","What do you think about the colours?"],x:"*colors* (US) o *colours* (UK)."},
    {t:"dict",say:"Could you send me the Figma file?",x:"*Could you* suona *coul-djiu*."}]},
  { id:"m6l4", h:"Ascolto: lo stand-up", min:10,
    tip:"Nell'ascolto vero non capisci tutto, ed è normale. Cerca **chi, cosa, quando**. Leggi la domanda **prima** di ascoltare (il *pre-listening* della guida).",
    vocab:[["stand-up","riunione breve quotidiana"],["blocker","ciò che ti blocca"],["handoff","passaggio del design agli sviluppatori"],["out of","su (four out of five = quattro su cinque)"]],
    extra:"Lo schema di ogni stand-up: *Yesterday I… · Today I'm going to… · My blocker is…*",
    trap:["Yesterday I finish the icons.","Yesterday I finished the icons."],
    q:[
    {t:"choice",ctxSay:"Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.",p:"Cosa ha finito ieri?",o:["The onboarding screens","The handoff","The final texts"],a:0,x:"*Yesterday I finished the new onboarding screens.*"},
    {t:"choice",ctxSay:"Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.",p:"Cosa farà oggi?",o:["Write the copy","Prepare the handoff","Test the onboarding"],a:1,x:"*Today I'm going to prepare the handoff.*"},
    {t:"choice",ctxSay:"Hi everyone. Yesterday I finished the new onboarding screens. Today I'm going to prepare the handoff for the developers. My only blocker is the copy: I'm still waiting for the final texts from marketing.",p:"Vero o falso: il suo blocco sono gli sviluppatori.",o:["Vero","Falso"],a:1,x:"Il blocco è il copy: aspetta i testi dal marketing."},
    {t:"choice",ctxSay:"Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.",p:"Quanti utenti hanno completato il checkout?",o:["Five out of five","Four out of five","Two out of five"],a:1,x:"*four out of five* = quattro su cinque."},
    {t:"choice",ctxSay:"Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.",p:"Quale problema è emerso?",o:["The total was wrong","Nobody found the promo code field","The checkout was too slow"],a:1,x:"*Nobody found the promo code field.*"},
    {t:"choice",ctxSay:"Quick update from me. The usability test went well: four out of five users completed the checkout. But nobody found the promo code field. So next week we're going to move it above the total.",p:"Cosa faranno la settimana prossima?",o:["Remove the promo code","Move the field above the total","Run another test"],a:1,x:"*We're going to move it above the total.*"},

function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function rid(){try{return hex(crypto.getRandomValues(new Uint8Array(12)))}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
async function pwHash(pass,salt){
  try{const enc=new TextEncoder();const key=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256))}
  catch(e){return "h"+hash(salt+":"+pass).toString(16)}
}

function itErr(m){m=String(m||"");
  if(/invalid login/i.test(m))return "Email o password errate.";
  if(/already registered|already been registered/i.test(m))return "Esiste già un account con questa email: accedi.";
  if(/email not confirmed/i.test(m))return "Prima conferma l'email: apri il link che ti abbiamo mandato.";
  if(/rate limit|too many/i.test(m))return "Troppi tentativi. Aspetta un minuto e riprova.";
  if(/failed to fetch|network/i.test(m))return "Nessuna connessione. Controlla internet e riprova.";
  if(/password/i.test(m))return "La password deve avere almeno 6 caratteri.";
  return m}

     .replace(/\bim\b/g,"i'm").replace(/\b(you|they)re\b/g,"$1're").replace(/\b(i|you|we|they)ve\b/g,"$1've").replace(/\b(you|they|it)ll\b/g,"$1'll").replace(/\b(she|he|that|what|it)s\b/g,"$1's").replace(/\blets\b/g,"let's");
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/n't\b/g," not")
     .replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would");

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

/* ---------------- costruzione delle sessioni (mai ripetute) ---------------- */
function buildItems(l,n,genOnly){
  const seen=new Set(S.seenQ[l.id]||[]);const out=[];const ids=new Set();
  const add=(id,q)=>{out.push({id,lid:l.id,q});ids.add(id)};
  const qid=q=>l.id+"~"+hash(JSON.stringify(q)).toString(36);
  if(!genOnly)l.q.forEach(q=>{const id=qid(q);if(out.length<(l.final?6:n)&&!seen.has(id)&&!ids.has(id))add(id,q)});
  const gens=genFor(l);const order=rshuffle(gens.map((_,i)=>i));let k=0,tries=0;
  while(out.length<n&&gens.length&&tries<500){
    tries++;let q=null;try{q=gens[order[k++%order.length]]()}catch(e){q=null}
    if(!q||(genOnly&&q.t==="shadow"))continue;
    const id=qid(q);
    if(ids.has(id)||(seen.has(id)&&tries<420))continue;
    add(id,q);
  }
  S.seenQ[l.id]=[...seen,...ids];return out;
}

}

/* ---------------- verifica ---------------- */
function textMatch(given,acc){
  const c=canon(given);let best=acc[0],bd=1e9;
  for(const a of acc){const ca=canon(a);if(ca===c)return {ok:true,correct:a};const d=lev(c,ca);if(d<bd){bd=d;best=a}}
  return {ok:false,correct:best,near:c.length>0&&bd<=Math.max(1,Math.floor(canon(best).length/12))};
}
function canVerify(q){
  if(!sel)return false;
  switch(q.t){
    case "choice":case "ui":case "listen":case "stress":return sel.j!=null;
    case "gap":case "fix":case "trans":case "dict":return sel.text.trim().length>0;
    case "order":return sel.picked.length===q.w.length;
    case "match":return Object.keys(sel.map).length===q.pairs.length;
    case "shadow":return true;
  }return false;
}
function accOf(q){return q.t==="dict"?(q.a||[q.say]):q.a}
function check(q){
  switch(q.t){
    case "choice":case "ui":case "listen":return {ok:sel.j===q.a,correct:plain(q.o[q.a]),given:plain(q.o[sel.j])};
    case "stress":return {ok:sel.j===q.a,correct:q.s.map((x,i)=>i===q.a?x.toUpperCase():x).join("·"),given:q.s.map((x,i)=>i===sel.j?x.toUpperCase():x).join("·")};
    case "gap":{const r=textMatch(sel.text,q.a);r.near=false;r.given=sel.text.trim();return r}
    case "fix":case "trans":case "dict":{const r=textMatch(sel.text,accOf(q));r.given=sel.text.trim();return r}
    case "order":{const g=sel.picked.map(i=>q.w[i]).join(" ");return {ok:canon(g)===canon(q.w.join(" ")),correct:q.w.join(" "),given:g}}
    case "match":{const ok=q.pairs.every((p,i)=>sel.map[i]===i);return {ok,correct:q.pairs.map(p=>p[0]+" = "+p[1]).join(" · "),given:""}}
    case "shadow":return {ok:true,correct:q.say,given:""};
  }
}
function verify(){
  const st=RUN.steps[RUN.pos];const q=curItem().q;if(!canVerify(q))return;
  const r=check(q);FB=Object.assign({x:q.x||"",t:q.t,pre:!!st.pre},r);
  record(r.ok,r.given);render();
  if(!r.ok&&(q.t==="listen"||q.t==="stress"))setTimeout(()=>speak(q.say),300);
}
function record(ok,given){
  const st=RUN.steps[RUN.pos];const it=RUN.items[st.i];const q=it.q;
  if(RUN.kind==="lesson"){const r=S.les[RUN.id].run;r.ans[st.i]={ok,g:given||""};if(!ok&&!st.pre)srsAdd(it)}
  else if(RUN.kind==="review")srsResult(it.id,ok);
  else if(!ok)srsAdd(it);
  S.stats.n++;if(ok)S.stats.ok++;
  let xp=0;
  if(ok){RUN.combo++;const base=q.t==="shadow"?5:10;const cb=RUN.combo>=3?Math.min(10,(RUN.combo-2)*2):0;xp=base+cb;RUN.xp.base+=base;RUN.xp.combo+=cb;gain(xp)}else RUN.combo=0;
  FB.xp=xp;FB.combo=RUN.combo;RUN.res.push({id:it.id,ok});save();
}
function overrideOk(){
  const st=RUN.steps[RUN.pos];const it=RUN.items[st.i];
  if(RUN.kind==="lesson"){S.les[RUN.id].run.ans[st.i].ok=true;delete S.srs[it.id]}
  else if(RUN.kind==="review"){const s=S.srs[it.id];if(s){s.box=Math.min(5,(s.box||1)+1);s.due=addDays(TODAY(),IV[s.box])}}

      <textarea id="ans" class="${done?(FB.ok?"ok":"ko"):""}" placeholder="${q.t==="fix"?"Riscrivi la frase corretta":"Scrivi in inglese"}" autocapitalize="sentences" spellcheck="false" ${done?"disabled":""}>${esc(sel.text)}</textarea>`;break}
    case "dict":
      h+=`<p class="qp">Ascolta e scrivi la frase</p><div class="audio"><button class="play" data-say="${esc(q.say)}" aria-label="Ascolta">${IC.play}</button><span><span class="at" style="display:block">Ascolta</span><span class="as">Una volta per il senso, una per le parole</span></span><button class="slow" data-say="${esc(q.say)}" data-rate="0.65">Lento</button></div>
      <textarea id="ans" class="${done?(FB.ok?"ok":"ko"):""}" placeholder="Scrivi quello che senti" autocapitalize="sentences" spellcheck="false" ${done?"disabled":""}>${esc(sel.text)}</textarea>`;break;
    case "order":{
      const order=shuffled(q.w.length,seed);const blk=!!q.block;
      const line=sel.picked.map(k=>`<button class="word ${blk?"blk":""}" data-unpick="${k}" ${done?"disabled":""}>${blk?`<span class="bn">${sel.picked.indexOf(k)+1}</span>`:""}${esc(q.w[k])}</button>`).join("");
      const bank=order.map(k=>`<button class="word ${blk?"blk":""} ${sel.picked.includes(k)?"ghost":""}" data-pick="${k}" ${done||sel.picked.includes(k)?"disabled":""}>${esc(q.w[k])}</button>`).join("");
      h+=`<p class="qp">${fmt(q.p)}</p><div class="ord-line ${blk?"block":""} ${done?(FB.ok?"ok":"ko"):""}" aria-label="La tua frase">${line||`<span class="ord-ph">${blk?"Tocca i paragrafi nell'ordine giusto":"Tocca le parole nell'ordine giusto"}</span>`}</div>${done?"":`<div class="ord-bank ${blk?"block":""}">${bank}</div>`}`;break}
    case "match":{
      const ro=shuffled(q.pairs.length,seed);
      const tagCol=k=>["var(--blue)","var(--orange)","var(--pink)","var(--green)","var(--purple)"][k%5];
      const left=q.pairs.map((p,k)=>{let c=sel.L===k?"cur":"";if(done)c=sel.map[k]===k?"ok":"ko";const has=sel.map[k]!=null;
        return `<button class="mt ${c}" data-ml="${k}" ${done?"disabled":""}><span class="tag" style="background:${has||done?tagCol(k):"var(--label3)"}">${k+1}</span><b>${esc(p[0])}</b></button>`}).join("");
      const right=ro.map(k=>{const owner=Object.keys(sel.map).find(x=>sel.map[x]===k);let c="";if(done)c=sel.map[k]===k?"ok":"ko";
        return `<button class="mt ${c} ${!done&&owner!=null?"used":""}" data-mr="${k}" ${done?"disabled":""}>${owner!=null||done?`<span class="tag" style="background:${tagCol(done?k:+owner)}">${(done?k:+owner)+1}</span>`:""}<span>${esc(q.pairs[k][1])}</span></button>`}).join("");
      h+=`<p class="qp">${fmt(q.p)}</p><p class="qhint">Tocca una parola a sinistra, poi il suo significato a destra.</p><div class="match"><div class="col">${left}</div><div class="col">${right}</div></div>`;break}
    case "shadow":
      h+=`<p class="qp">Ascolta, poi ripeti ad alta voce</p>
      <div class="shadowbox"><p class="en">${esc(q.say)}</p><p class="it">${esc(q.it||"")}</p></div>
      <div class="audio"><button class="play" data-say="${esc(q.say)}" aria-label="Ascolta">${IC.play}</button><span><span class="at" style="display:block">Velocità normale</span><span class="as">Copia ritmo e intonazione</span></span><button class="slow" data-say="${esc(q.say)}" data-rate="0.7">Lento</button></div>
      <p class="secf">Shadowing: ripeti subito dopo la voce, anche sovrapponendoti. Tre volte: lento, normale, senza leggere.</p>`;break;
  }
  let dock;
  if(!done){
    const lbl=q.t==="shadow"?"L'ho ripetuta ad alta voce":"Verifica";
    dock=`<button class="btn" data-act="verify" ${canVerify(q)?"":"disabled"}>${lbl}</button>`;
  } else {
    const textual=["fix","trans","dict","gap"].includes(q.t);
    const title=FB.ok?(FB.overridden?"Segnata come giusta":q.t==="shadow"?"Ottimo":FB.combo>=3?`Combo ×${FB.combo}!`:"Giusto!"):(FB.pre?"Normale sbagliare qui":FB.near?"Ci sei quasi":"Non proprio");
    let sol="";
    if(!FB.ok&&q.t!=="shadow")sol=`<p class="fsol">Soluzione: ${textual&&FB.given?diffMark(FB.correct,FB.given):`<strong>${esc(FB.correct)}</strong>`}</p>`;
    const sayTxt=sayFor(q);
    const links=`${sayTxt?`<button class="pill" data-say="${esc(plain(sayTxt))}">${IC.spk}Ascolta</button>`:""}${!FB.ok&&textual&&q.t!=="gap"?`<button class="pill" data-act="override">${IC.check}Era giusta</button>`:""}`;
    const xx=FB.pre&&!FB.ok?"Ora il trick ti spiega perché. "+(FB.x?plain(FB.x):""):FB.x;
    dock=`<div class="fb"><span class="fi">${FB.ok?IC.check:IC.x}</span><div><p class="ft">${title}${FB.xp?`<span class="xpchip">${IC.bolt}+${FB.xp} XP</span>`:""}</p>${sol}${xx?`<p class="fx">${fmt(xx)}</p>`:""}${links?`<div class="flinks">${links}</div>`:""}</div></div>
      <button class="btn" data-act="next">Continua</button>`;
  }
  return {body:h,dock};
}
function sayFor(q){
  if(q.t==="listen"||q.t==="stress")return q.say;
  if(q.t==="shadow"||q.t==="match")return "";
  if(q.t==="gap")return q.p.replace(/\(.*?\)/g,"").replace("___",plain(q.a[0]));
  if(q.t==="choice"||q.t==="ui"){if(/___/.test(q.p))return q.p.replace(/\(.*?\)/g,"").replace("___",plain(q.o[q.a]));return isEnglish(q.o[q.a])?plain(q.o[q.a]):""}
  return FB.correct;
}
function isEnglish(s){return /^[A-Za-z0-9 ,.'’?!\-…"“”%:/]+$/.test(plain(s))&&!/^(Vero|Falso)$/.test(s)}
function optBtn(o,j,a,done,big){
  let c="";if(done){if(j===a)c="isok";else if(j===sel.j)c="isko"}else if(sel.j===j)c="sel";
  const mk=c==="isok"?IC.check:c==="isko"?IC.x:c==="sel"?IC.check:"";
  return `<button class="opt ${big?"big":""} ${c}" data-opt="${j}" ${done?"disabled":""}>${big?"":`<span class="kbd">${j+1}</span>`}<span>${fmt(o)}</span>${big?"":`<span class="mk">${mk}</span>`}</button>`;
}
function diffMark(correct,given){
  const g=new Set(canon(given).split(" "));
  return correct.split(" ").map(w=>{const c=canon(w);return c&&!c.split(" ").every(x=>g.has(x))?`<mark>${esc(w)}</mark>`:esc(w)}).join(" ");
}

    <div class="btnrow"><button class="btn" data-act="gstart">Via!</button></div></div>`;
  if(!G.on)return `${head}<div style="--c:var(--orange)" class="summary"><span class="ringwrap">${ring(Math.min(1,G.score/20),"bigring",62,150)}<b>${G.score}</b></span><h1>${G.record?"Nuovo record!":"Tempo scaduto"}</h1><p>${G.score} giuste, ${G.miss} sbagliate · record ${S.splat}</p><div class="btnrow"><button class="btn" data-act="gstart">Gioca ancora</button><button class="btn ghost" data-act="back">Torna al ripasso</button></div></div>`;
  return `${head}<div style="--c:var(--orange)"><div class="splat-top"><span class="timer ${G.left<=10?"low":""}">${Math.floor(G.left/60)}:${String(G.left%60).padStart(2,"0")}</span><span class="score"><b>${G.score}</b><span>punti</span></span></div>
  <div class="bar"><i style="width:${G.left/60*100}%"></i></div>
  <div class="splat-q ${G.flash==="ko"?"flash-ko":G.flash==="ok"?"flash-ok":""}">${esc(G.cur.it[1])}</div>
  <div class="optgrid">${G.cur.opts.map((o,j)=>`<button class="opt" data-splat="${j}">${esc(o[0])}</button>`).join("")}</div></div>`;
}

/* ===================================================================== EVENTI */
document.addEventListener("click",e=>{
  if(e.target.closest(".sheet")&&!e.target.closest("button"))return;
  const b=e.target.closest("button,[data-say],summary,[data-act]");if(!b)return;
  const d=b.dataset;
  if(d.say!==undefined&&!d.act){speak(d.say,d.rate?+d.rate:undefined);if(V.screen==="run"&&sel)sel.heard=true;if(!d.setrate)return}
  if(d.setrate){S.rate=+d.rate;save();render();return}
  if(d.voice){S.voice=d.voice;save();render();speak(d.voice==="en-GB"?"Hello, this is the British voice.":"Hi, this is the American voice.");return}
  if(d.authmode){V.auth={mode:d.authmode,email:($("#au-email")||{}).value||(V.auth&&V.auth.email)};render();return}
  if(d.tab){if(V.screen==="home"&&V.tab===d.tab){window.scrollTo({top:0,behavior:"smooth"});return}go({screen:"home",tab:d.tab});return}
  if(d.goal){S.goal=+d.goal;save();render();return}
  if(d.mod){go({screen:"module",mod:d.mod});return}
  if(d.lesson){startLesson(d.lesson);return}
  if(d.splat!==undefined&&G&&G.on){const o=G.cur.opts[+d.splat];if(o===G.cur.it){G.score++;G.flash="ok"}else{G.miss++;G.flash="ko";toast(G.cur.it[0]+" = "+G.cur.it[1])}newRound();render();setTimeout(()=>{if(G)G.flash=null},360);return}
  if(V.screen==="run"&&!FB&&sel){
    const it=curItem();const q=it?it.q:null;
    if(q&&d.opt!==undefined){sel.j=+d.opt;if(q.t==="stress")speak(q.say);render();return}
    if(q&&d.pick!==undefined){sel.picked.push(+d.pick);render();return}
    if(q&&d.unpick!==undefined){sel.picked=sel.picked.filter(x=>x!==+d.unpick);render();return}
    if(q&&d.ml!==undefined){const k=+d.ml;if(sel.map[k]!=null){delete sel.map[k];sel.L=k}else sel.L=sel.L===k?null:k;render();return}
    if(q&&d.mr!==undefined){const r=+d.mr;const owner=Object.keys(sel.map).find(x=>sel.map[x]===r);if(owner!=null)delete sel.map[owner];if(sel.L!=null){sel.map[sel.L]=r;const nxt=q.pairs.findIndex((p,k)=>sel.map[k]==null);sel.L=nxt>=0?nxt:null}render();return}
  }
  switch(d.act){
    case "forgot":forgot();break;
    case "guest":signIn({uid:"guest",name:"",email:"",mode:"guest"},false);break;
    case "toregister":V.auth={mode:"register"};go({screen:"auth"});break;
    case "tologin":V.auth={mode:"login"};go({screen:"auth"});break;
    case "logout":signOut();break;
    case "method":go({screen:"method"});break;
    case "back":
      if(V.screen==="run")quitRun();
      else if(V.screen==="splat")go({screen:"home",tab:"rev"});
      else go({screen:"home"});break;
    case "askreset":V.sheet="reset";render();break;
    case "closesheet":V.sheet=null;render();break;
    case "doresetrun":V.sheet=null;if(RUN.kind==="lesson")startLesson(RUN.id,true);else if(RUN.kind==="review")startReview();else startMix();break;
    case "trick-ok":S.les[RUN.id].run.trick=true;save();advance();break;
    case "next":advance();break;
    case "verify":verify();break;
    case "override":overrideOk();break;
    case "redo":startLesson(RUN.id,true);break;
    case "review":startReview();break;
    case "mix":startMix();break;
    case "splat":G=null;go({screen:"splat"});break;
    case "gstart":stopGame();startGame();break;
    case "export":CONF=CONF==="export"?null:"export";render();break;
    case "import":CONF=CONF==="import"?null:"import";render();break;
    case "reset":CONF=CONF==="reset"?null:"reset";render();break;
    case "cancel":CONF=null;render();break;
    case "doreset":S=blank();save();CONF=null;toast("Progressi azzerati");go({screen:"home",tab:"mods"});break;
    case "copycode":{const t=$("#code");const v=t.value;
      const ok=()=>toast("Codice copiato");const fb=()=>{t.focus();t.select();toast("Seleziona e copia il codice")};
      try{navigator.clipboard.writeText(v).then(ok,fb)}catch(err){fb()}break}
    case "doimport":{try{const v=JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim()))));if(!v||typeof v!=="object"||!v.les)throw 0;S=Object.assign(blank(),v);save();CONF=null;toast("Progressi importati");go({screen:"home",tab:"mods"})}catch(err){toast("Codice non valido: copialo di nuovo per intero")}break}
  }
});
document.addEventListener("submit",e=>{if(e.target.id==="authform"){e.preventDefault();submitAuth()}});
document.addEventListener("input",e=>{
  if(e.target.id==="ans"&&sel){const had=sel.text.trim().length>0;sel.text=e.target.value;const has=sel.text.trim().length>0;if(had!==has){const b=document.querySelector('[data-act="verify"]');if(b)b.disabled=!has}}
  if(e.target.id==="tq"){V.tq=e.target.value;const tmp=document.createElement("div");tmp.innerHTML=renderTricksTab();const nl=tmp.querySelector("#tklist");$("#tklist").innerHTML=nl?nl.innerHTML:""}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&V.sheet){V.sheet=null;render();return}
  if(V.screen==="run"&&!FB&&!V.sheet&&/^[1-9]$/.test(e.key)&&!/INPUT|TEXTAREA/.test(e.target.tagName)){const o=document.querySelector(`[data-opt="${+e.key-1}"]`);if(o){o.click();return}}
  if(V.screen==="splat"&&G&&G.on&&/^[1-6]$/.test(e.key)){const o=document.querySelector(`[data-splat="${+e.key-1}"]`);if(o){o.click();return}}
  if(e.key!=="Enter"||V.screen!=="run"||V.sheet||e.target.tagName==="BUTTON")return;
  if(e.target.tagName==="TEXTAREA"&&!e.metaKey&&!e.ctrlKey&&!FB){e.preventDefault()}
  const b=document.querySelector('[data-act="verify"]:not([disabled]),.dock [data-act="next"],.dock [data-act="trick-ok"]');
  if(b){e.preventDefault();b.click()}
});

initTabbar();
boot();
</script>
