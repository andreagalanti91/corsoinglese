<style>
/* Layout: app iPhone a colonna singola. Home con hero "saldo" (XP) su cielo stellato, segmented control in vetro
   e card-modulo con glow colorato (come le chain card dello screenshot); lezioni a schermo intero con dock in basso. */
:root{
  --bg:#05070D; --sky1:#0E2244; --sky2:#071022; --star:rgba(255,255,255,.55);
  --card:rgba(22,26,38,.78); --card-solid:#141824; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.08); --stroke2:rgba(255,255,255,.16);
  --label:#F4F6FB; --label2:rgba(228,234,250,.62); --label3:rgba(228,234,250,.32); --sep:rgba(255,255,255,.08);
  --dock:rgba(10,12,20,.82); --on-accent:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.45);
  --blue:#0A84FF; --indigo:#7D7AFF; --purple:#BF5AF2; --pink:#FF375F; --orange:#FF9F0A; --teal:#40C8E0; --green:#30D158; --red:#FF453A; --gray:#8E8E93;
  --good:#30D158; --bad:#FF453A; --warn:#FFD60A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F7; --sky1:#CFDDF6; --sky2:#E8EEF8; --star:rgba(40,70,140,.18);
  --card:rgba(255,255,255,.86); --card-solid:#FFFFFF; --glass:rgba(20,30,60,.05); --glass2:rgba(20,30,60,.09);
  --stroke:rgba(20,30,60,.08); --stroke2:rgba(20,30,60,.16);
  --label:#0B1020; --label2:rgba(30,40,70,.62); --label3:rgba(30,40,70,.34); --sep:rgba(20,30,60,.10);
  --dock:rgba(246,248,252,.86); --shadow:0 10px 30px rgba(30,50,100,.14);
  --blue:#007AFF; --indigo:#5856D6; --purple:#AF52DE; --pink:#FF2D55; --orange:#F08A00; --teal:#0FA3BD; --green:#28A745; --red:#E5352B; --gray:#8E8E93;
  --good:#1F9D45; --bad:#E5352B; --warn:#C99700;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF1F7; --sky1:#CFDDF6; --sky2:#E8EEF8; --star:rgba(40,70,140,.18);
  --card:rgba(255,255,255,.86); --card-solid:#FFFFFF; --glass:rgba(20,30,60,.05); --glass2:rgba(20,30,60,.09);
  --stroke:rgba(20,30,60,.08); --stroke2:rgba(20,30,60,.16);
  --label:#0B1020; --label2:rgba(30,40,70,.62); --label3:rgba(30,40,70,.34); --sep:rgba(20,30,60,.10);
  --dock:rgba(246,248,252,.86); --shadow:0 10px 30px rgba(30,50,100,.14);
  --blue:#007AFF; --indigo:#5856D6; --purple:#AF52DE; --pink:#FF2D55; --orange:#F08A00; --teal:#0FA3BD; --green:#28A745; --red:#E5352B; --gray:#8E8E93;
  --good:#1F9D45; --bad:#E5352B; --warn:#C99700;
  color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.42;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
em{font-style:italic} strong{font-weight:650}
.hl{color:var(--c,var(--blue));font-weight:650;font-style:normal}
svg{display:block}

.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* ---------- HERO ---------- */
.sky{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 90% at 70% 0%,var(--sky1),var(--sky2) 55%,var(--bg) 100%);overflow:hidden;border-radius:0 0 34px 34px}
.sky::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:radial-gradient(1px 1px at 12% 18%,var(--star),transparent 60%),radial-gradient(1px 1px at 32% 64%,var(--star),transparent 60%),radial-gradient(1.4px 1.4px at 58% 26%,var(--star),transparent 60%),radial-gradient(1px 1px at 74% 72%,var(--star),transparent 60%),radial-gradient(1px 1px at 88% 34%,var(--star),transparent 60%),radial-gradient(1.2px 1.2px at 44% 88%,var(--star),transparent 60%),radial-gradient(1px 1px at 6% 80%,var(--star),transparent 60%),radial-gradient(1px 1px at 94% 90%,var(--star),transparent 60%);
  background-size:220px 180px}
.topbar{position:relative;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--label)}
.iconbtn:hover{background:var(--glass)}
.iconbtn svg{width:22px;height:22px}
.balance{position:relative;text-align:center;padding:18px 0 4px}
.balance .k{font-size:15px;color:var(--label2);font-weight:500}
.balance .big{font-family:var(--display);font-size:clamp(50px,15vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.balance .big small{font-size:.62em;color:var(--label3);font-weight:600;letter-spacing:-.02em}
.balance .today{font-size:15px;color:var(--label2);margin-top:4px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.up{color:var(--good);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.up svg{width:12px;height:12px}
.flame{color:var(--orange);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.flame svg{width:14px;height:14px}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);margin-top:22px}
.seg button{border-radius:999px;padding:9px 6px;font-size:15px;font-weight:550;color:var(--label2);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass2);color:var(--label);box-shadow:inset 0 0 0 1px var(--stroke2),0 4px 14px rgba(0,0,0,.18)}
.seg .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;margin-left:6px;padding:0 6px;vertical-align:1px}


/* ---------- SYSTEM CONTROLS ---------- */
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke);color:var(--label);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .15s,background .15s}
.circ:hover{background:var(--glass2)} .circ:active{transform:scale(.9)}
.circ svg{width:17px;height:17px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--label2);padding:7px 11px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke)}
.stat svg{width:17px;height:17px}
.stat.fire{color:var(--label3)} .stat.fire.lit{color:var(--orange)}
.stat.xp{color:var(--warn)} .stat.ice{color:var(--teal)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:20px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--label3);font-weight:650}
.week i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke);color:var(--label3)}
.week i svg{width:16px;height:16px}
.week .on i{background:linear-gradient(150deg,#FFC24D,var(--orange));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--orange) 45%,transparent)}
.week .fz i{background:linear-gradient(150deg,#8EDCFF,var(--teal));color:#fff;box-shadow:none}
.week .now{color:var(--label)} .week .now i{box-shadow:inset 0 0 0 2px var(--label2)}
.week .now.on i{box-shadow:0 0 0 2px var(--sky2),0 0 0 4px var(--orange)}
.goal{position:relative;margin-top:18px;padding:14px 16px;border-radius:20px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke)}
.gtop{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.gtop b{font-variant-numeric:tabular-nums;color:var(--warn)}
.goal.met .gtop b{color:var(--good)}
.gbar{height:10px;border-radius:999px;background:var(--glass2);overflow:hidden;margin-top:10px}
.gbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 70%,#fff),var(--warn));transition:width .5s}
.goal.met .gbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 70%,#fff),var(--good))}
.lhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--dock);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.pbar{flex:1;height:16px;border-radius:999px;background:var(--glass2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
.pbar i{display:block;height:100%;border-radius:999px;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c));transition:width .55s cubic-bezier(.3,1.35,.5,1)}
.pbar i.has{min-width:16px}
.pbar i::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.38)}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--label2);font-weight:600;padding:12px 2px 0;font-variant-numeric:tabular-nums}
.pmeta span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo{flex:none;color:var(--orange);display:inline-flex;gap:4px;align-items:center;animation:pop .35s} .combo svg{width:13px;height:13px}
.xpchip{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:13px;font-weight:750;color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent);padding:2px 8px;border-radius:999px;vertical-align:3px;animation:pop .4s}
.xpchip svg{width:11px;height:11px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));animation:fade .2s}
.sheet{width:100%;max-width:540px;display:flex;flex-direction:column;gap:8px;animation:sup .28s cubic-bezier(.2,.9,.3,1)}
.sheet .card{background:var(--card-solid);border-radius:20px;overflow:hidden;text-align:center}
.sheet .sh{padding:18px 20px 14px;font-size:14px;color:var(--label2);line-height:1.4}
.sheet .sh b{display:block;font-size:17px;color:var(--label);margin-bottom:4px}
.sheet .card button{display:block;width:100%;padding:17px;font-size:19px;color:var(--blue);border-top:1px solid var(--sep)}
.sheet .card button:active{background:var(--glass)}
.sheet .card button.danger{color:var(--bad);font-weight:600}
.sheet .card.cancel button{border-top:0;font-weight:650}
@keyframes tin{from{transform:translate(-50%,-16px);opacity:0}}
@keyframes sup{from{transform:translateY(60px);opacity:0}} @keyframes fade{from{opacity:0}}
.xplist .row{grid-template-columns:auto minmax(0,1fr) auto;min-height:48px}
.xplist .row .rr{color:var(--warn);font-weight:700}
.xplist .tot .rt{font-weight:700} .xplist .tot .rr{font-size:20px}
.streakline{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-weight:650;color:var(--orange)}
.streakline svg{width:18px;height:18px}

/* ---------- MODULE CARDS ---------- */
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mcard{--c:var(--blue);position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 32px;gap:4px 14px;align-items:center;width:100%;text-align:left;padding:38px 16px 16px;border-radius:24px;
  background:radial-gradient(130% 150% at 0% 100%,color-mix(in srgb,var(--c) 34%,transparent) 0%,transparent 52%),linear-gradient(180deg,var(--glass),transparent 60%),var(--card);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,var(--stroke)),inset 0 1px 0 var(--stroke2),var(--shadow);transition:transform .18s}
.mcard:active{transform:scale(.985)}
.mcard:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,var(--stroke)),inset 0 1px 0 var(--stroke2),var(--shadow)}
.micon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent);grid-row:span 2}
.micon svg{width:24px;height:24px}
.mtitle{font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.mtag{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;font-weight:550;margin-top:2px}
.badge{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge.doing{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 45%,transparent)}
.badge.todo{color:var(--label2);background:var(--glass);box-shadow:inset 0 0 0 1px var(--stroke2)}
.badge.done{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 45%,transparent)}
.mfoot{grid-column:2 / 4;display:flex;align-items:center;gap:10px;margin-top:10px}
.dots{display:flex}
.dots i{width:22px;height:22px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px var(--card-solid);background:var(--glass2);display:grid;place-items:center}
.dots i:first-child{margin-left:0}
.dots i.ok{background:var(--c)}
.dots i.half{background:conic-gradient(var(--c) var(--p),var(--glass2) 0)}
.dots i svg{width:12px;height:12px;color:#fff}
.mbar{flex:1;min-width:0;height:10px;border-radius:999px;background:var(--glass2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.mbar i{display:block;height:100%;border-radius:999px;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));transition:width .5s}
.mbar i.has{min-width:10px}
.mbar i::after{content:"";position:absolute;left:5px;right:5px;top:2px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35)}
.mmeta{font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums}
.chevc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--stroke2);color:var(--label2);justify-self:end;align-self:end}
.chevc svg{width:12px;height:12px}

.sech{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:26px 4px 8px}
.secf{font-size:13px;color:var(--label2);padding:8px 4px 0;line-height:1.4}

/* ---------- GROUPED LISTS ---------- */
.group{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;position:relative;width:100%;text-align:left;min-height:56px}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:62px;height:1px;background:var(--sep)}
button.row:hover{background:var(--glass)}
.row .rt{font-size:17px;font-weight:500;display:block;line-height:1.25}
.row .rs{font-size:14px;color:var(--label2);display:block;margin-top:2px}
.row .rr{display:flex;align-items:center;gap:10px;color:var(--label2);font-size:15px;font-variant-numeric:tabular-nums}
.num{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--c,var(--blue))}
.num.ghost{background:var(--glass2);color:var(--label2)}
.num svg{width:17px;height:17px}
.chev{width:8px;height:14px;color:var(--label3)}
.ring{width:28px;height:28px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4}
.ring .bgc{stroke:var(--glass2)} .ring .fg{stroke:var(--c,var(--blue));stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.done .fg{stroke:var(--good)}

/* ---------- NAV (inner screens) ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--dock);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.nav-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:40px}
.nav{border-bottom-color:transparent}
.back{color:var(--blue);display:inline-flex;align-items:center;gap:4px;font-size:17px;justify-self:start;padding:4px 4px 4px 0}
.circ svg[viewBox="0 0 11 19"]{width:10px;height:17px;margin-left:-2px}
.back svg{width:11px;height:19px;flex:none}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.ntitle{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.nright{justify-self:end;display:flex;align-items:center;gap:4px;color:var(--label2);font-size:15px;font-variant-numeric:tabular-nums}
.nright .iconbtn{color:var(--blue);width:36px;height:36px}
.bar{height:5px;border-radius:3px;background:var(--glass2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--blue));border-radius:3px;transition:width .35s}

.lt{padding:20px 0 4px}
.eyebrow{font-size:13px;font-weight:650;color:var(--c,var(--label2));text-transform:uppercase;letter-spacing:.05em}
.lt h1{font-family:var(--display);font-size:clamp(30px,8vw,36px);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance;margin-top:4px}
.lead{color:var(--label2);margin-top:8px;font-size:17px;max-width:60ch}
.mhead{display:flex;gap:14px;align-items:center;padding-top:22px}
.mhead .micon{grid-row:auto;width:56px;height:56px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stats3 > div{padding:14px 16px;position:relative}
.stats3 > div + div::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--sep)}
.stats3 .k{font-size:13px;color:var(--label2)}
.stats3 .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats3 .v small{font-size:14px;color:var(--label2);font-weight:500}

/* ---------- TRICK CARD ---------- */
.trick{position:relative;margin-top:18px;border-radius:24px;padding:20px 18px 18px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 55%),var(--card);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 28%,var(--stroke)),var(--shadow)}
.trick .eyebrow{display:flex;align-items:center;gap:6px}
.trick .eyebrow svg{width:15px;height:15px}
.tipbig{font-size:20px;line-height:1.42;margin-top:10px;letter-spacing:-.015em}
.formula{overflow-x:auto;margin:16px -18px 0;padding:0 18px}
.fgrid{display:grid;min-width:max-content}
.fchip{border-radius:10px;color:#fff;font-size:13px;font-weight:700;padding:7px 10px;margin:0 6px 8px 0;text-align:center;white-space:nowrap}
.fcell{font-size:16px;padding:9px 14px 9px 2px;border-top:1px solid var(--sep);white-space:nowrap;font-weight:500;cursor:pointer}
.fcell.dash{color:var(--label3);font-weight:400}
.fhint{font-size:13px;color:var(--label3);margin-top:6px;display:flex;align-items:center;gap:6px}
.fhint svg{width:14px;height:14px}
.extra{margin-top:14px;font-size:16px;color:var(--label);line-height:1.5;padding:12px 14px;border-radius:14px;background:var(--glass)}
.trap{margin-top:12px;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.trap .ti{width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center}
.trap .ti svg{width:14px;height:14px}
.trap .tk{font-size:12px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.05em}
.wrong{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.right{color:var(--good);font-weight:650}
.arrow{color:var(--label3);margin:0 6px}
.vocab{margin-top:14px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px 10px 14px;position:relative;text-align:left;width:100%}
.vrow + .vrow::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.vrow:hover{background:var(--glass)}
.vrow b{font-weight:650;font-size:16px;display:block}
.vrow span{font-size:14px;color:var(--label2);display:block}
.spk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--c,var(--blue));background:color-mix(in srgb,var(--c,var(--blue)) 14%,transparent);flex:none}
.spk svg{width:16px;height:16px}

/* ---------- QUESTIONS ---------- */
.qtype{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--label2);margin-top:26px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtype .pre{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:6px;padding:2px 7px;font-size:11px}
.qp{font-family:var(--display);font-size:clamp(23px,6vw,28px);font-weight:620;letter-spacing:-.02em;line-height:1.3;margin-top:8px;text-wrap:balance}
.qp input{font:inherit;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:0;border-bottom:2px solid var(--c);border-radius:8px 8px 2px 2px;padding:0 8px;width:7.2em;max-width:100%;letter-spacing:inherit}
.qp input:focus{outline:none;background:color-mix(in srgb,var(--c) 20%,transparent)}
.qp input.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-color:var(--good)}
.qp input.ko{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
.qhint{font-size:15px;color:var(--label2);margin-top:8px}
.ctx{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke);font-size:17px}
.audio{margin-top:18px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke)}
.play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent)}
.play svg{width:24px;height:24px}
.audio .at{font-weight:600}
.audio .as{font-size:14px;color:var(--label2)}
.audio .slow{margin-left:auto;font-size:14px;font-weight:600;color:var(--c);padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.transcript{margin-top:10px;font-size:15px;color:var(--label2);padding:0 4px}
.opts{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;font-size:17px;min-height:56px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke);transition:box-shadow .15s,background .15s}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--stroke2)}
.opt .mk{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--stroke2);display:grid;place-items:center}
.opt .mk svg{width:14px;height:14px;color:#fff}
.opt:active:not(:disabled),.word:active:not(:disabled),.mt:active:not(:disabled){transform:scale(.98)}
.opt.sel{box-shadow:inset 0 0 0 2px var(--c)}
.opt.sel .mk{background:var(--c);box-shadow:none}
.opt.isok{background:color-mix(in srgb,var(--good) 14%,var(--card-solid));box-shadow:inset 0 0 0 2px var(--good)} .opt.isok .mk{background:var(--good);box-shadow:none}
.opt.isko{background:color-mix(in srgb,var(--bad) 12%,var(--card-solid));box-shadow:inset 0 0 0 2px var(--bad)} .opt.isko .mk{background:var(--bad);box-shadow:none}
.opt:disabled{cursor:default}
.opt.big{font-size:22px;font-weight:600;justify-content:center;text-align:center}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.ord-line{min-height:68px;margin-top:20px;padding:10px;border-radius:18px;background:var(--card);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;box-shadow:inset 0 0 0 1.5px var(--stroke2)}
.ord-line.block{flex-direction:column;flex-wrap:nowrap}
.ord-line.ok{box-shadow:inset 0 0 0 2px var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card-solid))}
.ord-line.ko{box-shadow:inset 0 0 0 2px var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card-solid))}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:46px}
.ord-bank.block{flex-direction:column}
.word{background:var(--glass2);border-radius:12px;padding:10px 14px;font-size:17px;box-shadow:inset 0 0 0 1px var(--stroke2);text-align:left}
.word:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--c)}
.word.ghost{visibility:hidden}
.word.blk{width:100%;font-size:16px;line-height:1.35}
.word.blk .bn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
.ord-ph{color:var(--label3);font-size:15px;padding:10px 6px}
textarea{font-size:19px;width:100%;min-height:112px;resize:vertical;border:0;border-radius:18px;padding:14px 16px;background:var(--card);color:var(--label);margin-top:20px;line-height:1.4;box-shadow:inset 0 0 0 1px var(--stroke2)}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--c)}
textarea.ok{box-shadow:inset 0 0 0 2px var(--good)} textarea.ko{box-shadow:inset 0 0 0 2px var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{min-height:54px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke2);font-size:15px;line-height:1.25;text-align:left;display:flex;align-items:center;gap:8px}
.mt b{font-weight:650;font-size:16px}
.mt .tag{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.mt.cur{box-shadow:inset 0 0 0 2px var(--c)}
.mt.used{opacity:.45}
.mt.ok{box-shadow:inset 0 0 0 2px var(--good)} .mt.ko{box-shadow:inset 0 0 0 2px var(--bad)}
.syl{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;justify-content:center}
.syl button{min-width:64px;padding:16px 14px;border-radius:16px;font-size:24px;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke2)}
.syl button.sel{box-shadow:inset 0 0 0 2px var(--c);color:var(--c);text-transform:uppercase}
.syl button.isok{box-shadow:inset 0 0 0 2px var(--good);color:var(--good);text-transform:uppercase}
.syl button.isko{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.shadowbox{margin-top:18px;border-radius:20px;padding:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke)}
.shadowbox .en{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.35}
.shadowbox .it{font-size:15px;color:var(--label2);margin-top:6px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.steps3 div{font-size:13px;color:var(--label2);padding:10px;border-radius:12px;background:var(--glass);line-height:1.3}
.steps3 b{display:block;color:var(--label);font-size:14px}

/* UI mockups (dual coding) */
.mock{margin-top:18px;border-radius:24px;padding:18px;background:var(--card-solid);box-shadow:inset 0 0 0 1px var(--stroke2),var(--shadow);font-size:15px;display:flex;flex-direction:column;gap:10px;min-height:150px;justify-content:center;position:relative;overflow:hidden}
.mk-row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.mk-switch{width:51px;height:31px;border-radius:999px;background:var(--glass2);position:relative}
.mk-switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk-switch.on{background:var(--good)} .mk-switch.on i{left:22px}
.mk-ck,.mk-rd{display:flex;align-items:center;gap:10px}
.mk-ck i,.mk-rd i{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--label3);display:grid;place-items:center}
.mk-rd i{border-radius:50%}
.mk-ck.on i{background:var(--blue);box-shadow:none}
.mk-ck.on i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mk-rd.on i{box-shadow:inset 0 0 0 2px var(--blue)} .mk-rd.on i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.mk-cap{font-size:12px;color:var(--label2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mk-field{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--stroke2);background:var(--glass)}
.mk-field svg{width:12px;height:12px;color:var(--label2)}
.mk-menu{border-radius:12px;box-shadow:inset 0 0 0 1px var(--stroke2),var(--shadow);overflow:hidden;background:var(--card-solid)}
.mk-menu span{display:block;padding:9px 14px} .mk-menu span.on{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);font-weight:600}
.mk-lines{display:flex;flex-direction:column;gap:7px}
.mk-lines i{height:9px;border-radius:5px;background:var(--glass2)} .mk-lines i:nth-child(2){width:80%} .mk-lines i:nth-child(3){width:60%}
.mk-toast{align-self:center;display:flex;align-items:center;gap:8px;background:#1C1F27;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mk-toast svg{width:14px;height:14px;color:#30D158}
.mk-bc{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:15px} .mk-bc b{color:var(--label);font-weight:600} .mk-bc em{color:var(--label3);font-style:normal}
.mk-dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.mk-modal{position:relative;align-self:center;width:min(250px,88%);border-radius:16px;background:var(--card-solid);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden}
.mk-modal b{display:block;padding:14px 12px 2px} .mk-modal p{font-size:13px;color:var(--label2);padding:0 12px 12px}
.mk-modal div{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--sep)} .mk-modal div span{padding:10px;color:var(--blue)} .mk-modal div span + span{border-left:1px solid var(--sep);color:var(--bad);font-weight:600}
.mk-i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--label2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--label2);font-style:italic}
.mk-tip{align-self:flex-end;position:relative;background:#1C1F27;color:#fff;font-size:13px;padding:7px 11px;border-radius:10px;margin-right:-4px}
.mk-tip::after{content:"";position:absolute;bottom:-5px;right:18px;width:10px;height:10px;background:#1C1F27;transform:rotate(45deg)}
.mk-tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:6px -18px -18px;padding:10px 0 12px;border-top:1px solid var(--sep);background:var(--glass)}
.mk-tabs span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--label3)} .mk-tabs span i{width:20px;height:20px;border-radius:6px;background:var(--label3)}
.mk-tabs span.on{color:var(--blue)} .mk-tabs span.on i{background:var(--blue)}
.mk-slider{height:6px;border-radius:3px;background:var(--glass2);position:relative;margin:14px 4px}
.mk-slider span{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue)}
.mk-slider i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ---------- DOCK & FEEDBACK ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--dock);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--sep)}
.dock-in{max-width:528px;margin:0 auto}
.dock.ok{background:color-mix(in srgb,var(--good) 16%,var(--dock))} .dock.ko{background:color-mix(in srgb,var(--bad) 14%,var(--dock))}
.fb{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.fb .fi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dock.ok .fi{background:var(--good)} .dock.ko .fi{background:var(--bad)}
.fb .fi svg{width:17px;height:17px}
.fb .ft{font-weight:700;font-size:18px}
.dock.ok .ft{color:var(--good)} .dock.ko .ft{color:var(--bad)}
.fb .fsol{font-size:17px;margin-top:2px}
.fb .fsol mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.fb .fx{font-size:15px;color:var(--label2);margin-top:4px}
.fb .flinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;color:var(--label);background:var(--glass2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:999px;font-size:17px;font-weight:650;padding:0 22px;width:100%;background:var(--c,var(--blue));color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--c,var(--blue)) 35%,transparent);transition:transform .12s,filter .12s}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);pointer-events:none}
.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.94)}
.btn:disabled{cursor:default;box-shadow:none;background:var(--glass2);color:var(--label3)}
.btn:disabled::before,.btn.ghost::before{display:none}
.btn.ghost{background:var(--glass2);color:var(--label);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn svg{width:18px;height:18px}
.dock.ok .btn{background:var(--good);box-shadow:none} .dock.ko .btn{background:var(--bad);box-shadow:none}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* ---------- SUMMARY ---------- */
.summary{text-align:center;padding-top:34px}
.bigring{width:150px;height:150px;transform:rotate(-90deg)}
.bigring circle{fill:none;stroke-width:12}
.bigring .bgc{stroke:var(--glass2)} .bigring .fg{stroke:var(--c);stroke-linecap:round}
.ringwrap{position:relative;display:inline-block}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.summary h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:16px;text-wrap:balance}
.summary p{color:var(--label2);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.kpi{border-radius:18px;padding:14px 10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke)}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--label2)}

/* ---------- REVIEW TAB ---------- */
.feature{--c:var(--purple);position:relative;width:100%;text-align:left;border-radius:24px;padding:18px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 55%),var(--card);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 24%,var(--stroke)),var(--shadow);display:block}
.feature + .feature{margin-top:12px}
.feature .fh{display:flex;align-items:center;gap:12px}
.feature .fh .micon{grid-row:auto;width:42px;height:42px}
.feature .fh .micon svg{width:21px;height:21px}
.feature h2,.feature .h2{display:block;font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.02em}
.feature .fs{font-size:14px;color:var(--label2)}
.feature .fbig{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums;line-height:1}
.feature .fbig small{font-size:17px;color:var(--label2);font-weight:500;letter-spacing:-.01em}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px;align-items:end;height:74px}
.boxes div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.boxes i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--c) 70%,transparent);min-height:4px}
.boxes span{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}

<script>
/* =====================================================================
   CONTENUTI DEL CORSO
   Ogni lezione: 1 trick (teoria, ~30%) + 7-10 esercizi (pratica, ~70%).
   Il primo esercizio di ogni lezione è un pre-test: si prova prima di studiare.
   Formattazione testi: **grassetto**, *corsivo*, ==evidenziato==
   ===================================================================== */
const MODS = [
/* ---------------- MODULO 1 ---------------- */
{ id:"m1", color:"orange", icon:"studio", title:"Il tuo studio", tag:"Presente", sub:"Presentarti, descrivere il team e la tua routine di lavoro.",
  lessons:[
  { id:"m1l1", h:"Chi sei: il trick di BE", min:8,
    tip:"Quando in italiano diresti *essere*, ma anche *avere anni* o *avere ragione*, in inglese usi **BE**. Il ruolo vuole sempre l'articolo: *I'm ==a== designer*.",
    formula:[["Chi","blue"],["am / is / are","orange"],["Ruolo · età · stato","green"]],
    rows:[["I","'m","a UX/UI designer."],["Our team","is","small but fast."],["The devs","are","in Milan."],["I","'m","40."]],
    extra:"Domanda: scambia i primi due pezzi → *==Are you== free? ==Is it== ready?* Per il lavoro: *I work ==as== a designer*, non *like*.",
    trap:["I am designer.","I'm a designer."],
    q:[
    {t:"choice",p:"Come ti presenti al cliente?",o:["I am designer.","I'm a designer.","I'm designer of apps."],a:1,x:"Il ruolo vuole l'articolo: *a designer*."},
    {t:"gap",p:"The prototype ___ ready yet. (negativa)",a:["isn't","is not"],x:"*is* + *not* → *isn't*."},
    {t:"gap",p:"___ you free for a quick call?",a:["are"],x:"Domanda con BE: *Are you…?*"},
    {t:"choice",p:"“Ho 40 anni”",o:["I have 40 years.","I'm 40.","I'm 40 years."],a:1,x:"L'età si dice con BE: *I'm 40* (oppure *I'm 40 years old*)."},
    {t:"choice",p:"“Lavoro come product designer”",o:["I work like a product designer.","I work as a product designer.","I work how a product designer."],a:1,x:"Ruolo → *as*."},
    {t:"order",p:"Il cliente è contento del redesign?",w:["Is","the","client","happy","with","the","redesign?"],x:"Domanda con BE: *Is* va in testa."},
    {t:"fix",p:"You have right, the contrast is too low.",a:["You're right, the contrast is too low."],x:"*Avere ragione* = *be right*."},
    {t:"trans",p:"Ciao, sono UX/UI designer e lavoro a Firenze.",a:["Hi, I'm a UX/UI designer and I work in Florence.","Hi, I'm a UX/UI designer and I'm based in Florence.","Hi, I'm a UX and UI designer and I work in Florence."]}]},
  { id:"m1l2", h:"La S di he / she / it", min:8,
    tip:"Al presente il verbo resta uguale, tranne con **he / she / it**: aggiungi una **S**. Una persona sola, una S. Vale anche per *the team*, *the app*, *our PM*.",
    formula:[["He / She / It","blue"],["verbo + S","orange"],["Resto","green"]],
    rows:[["Our PM","writes","the specs."],["The developer","fixes","the bugs."],["The app","has","two themes."],["The team","ships","every two weeks."]],
    extra:"Ortografia: *-es* dopo s, sh, ch, x, o (*fix==es==, push==es==, go==es==*); consonante + y → *-ies* (*appl==ies==*); *have* → *==has==*.",
    trap:["The app work offline.","The app works offline."],
    q:[
    {t:"gap",p:"Our PM ___ (write) the user stories.",a:["writes"],x:"*our PM* = he/she → +S."},
    {t:"gap",p:"The developer ___ (push) the code every evening.",a:["pushes"],x:"Dopo *sh* → *-es*."},
    {t:"gap",p:"The design system ___ (have) 40 components.",a:["has"],x:"*have* → *has*."},
    {t:"gap",p:"The new layout ___ (apply) the 8-point grid.",a:["applies"],x:"Consonante + y → *-ies*."},
    {t:"choice",p:"We ___ a usability test every month.",o:["run","runs"],a:0,x:"Con *we* niente S."},
    {t:"order",p:"Il mio team usa Figma e Jira.",w:["My","team","uses","Figma","and","Jira."],x:"*my team* = it → *uses*."},
    {t:"fix",p:"She manage the design team.",a:["She manages the design team."],x:"*she* → +S."},
    {t:"choice",p:"The app ___ offline.",o:["work","works","working"],a:1,x:"*the app* = it → *works*."}]},
  { id:"m1l3", h:"Domande: DO e l'ordine Q-A-S-V", min:10,
    tip:"Per domande e negative non toccare il verbo: metti **do / does** davanti. Ordine fisso: **Q**uestion word · **A**usiliare · **S**oggetto · **V**erbo.",
    formula:[["Q","indigo"],["do / does","purple"],["Chi","blue"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["What tools","do","you","use?","—"],["How often","does","the team","test","with users?"],["Why","do","users","drop off","here?"]],
    extra:"Negativa: *don't / doesn't* + verbo nudo → *Users ==don't read== long text. The button ==doesn't work==.* Con *does* la S se la prende lui.",
    trap:["Where you work?","Where do you work?"],
    q:[
    {t:"choice",p:"___ the client like the new palette?",o:["Do","Does","Is"],a:1,x:"*the client* = he/she → *Does*."},
    {t:"choice",p:"The button doesn't ___ on Safari.",o:["work","works","working"],a:0,x:"Dopo *doesn't* il verbo è nudo."},
    {t:"gap",p:"Users ___ (not / read) long paragraphs.",a:["don't read","do not read"],x:"*don't* + verbo nudo."},
    {t:"order",p:"Quali strumenti usi?",w:["What","tools","do","you","use?"],x:"Q-A-S-V."},
    {t:"order",p:"Perché gli utenti abbandonano qui?",w:["Why","do","users","drop","off","here?"],x:"Q-A-S-V: *Why do users…*"},
    {t:"choice",p:"___ do you run user interviews? — Once a month.",o:["How often","How long","How much"],a:0,x:"Frequenza → *How often*."},
    {t:"fix",p:"What you think about the onboarding?",a:["What do you think about the onboarding?","What do you think of the onboarding?"],x:"Manca l'ausiliare: Q-A-S-V."},
    {t:"fix",p:"Does she works remotely?",a:["Does she work remotely?"],x:"Con *does* il verbo resta nudo."}]},
  { id:"m1l4", h:"Sempre o adesso: -ING e avverbi", min:10,
    tip:"Abitudine → **presente semplice** (*We ship every Friday*). Lavoro in corso, ora o in questo sprint → **BE + -ing**. Gli avverbi di frequenza vanno **prima del verbo**, ma **dopo BE**.",
    formula:[["Chi","blue"],["am / is / are","orange"],["verbo-ing","pink"],["ora · this sprint","indigo"]],
    rows:[["I","'m","redesigning","the checkout this sprint."],["We","'re","testing","a new flow."],["She","isn't","working","today."]],
    extra:"Avverbi: *I ==always== test on mobile. I'm ==usually== in the office on Mondays.* Verbi di stato senza -ing: *know, understand, need, want, like* → *I ==understand==*, non *I'm understanding*.",
    trap:["I test always on mobile.","I always test on mobile."],
    q:[
    {t:"choice",p:"Quale suona naturale?",o:["I test always on mobile.","I always test on mobile.","Always I test on mobile."],a:1,x:"L'avverbio va prima del verbo."},
    {t:"gap",p:"I ___ (share) my screen now.",a:["am sharing","'m sharing"],x:"*now* → BE + -ing (la -e cade: *sharing*)."},
    {t:"gap",p:"This sprint we ___ (work) on dark mode.",a:["are working","'re working"],x:"*this sprint* = periodo in corso."},
    {t:"choice",p:"We usually ___ on Fridays.",o:["ship","are shipping"],a:0,x:"*usually* = abitudine → presente semplice."},
    {t:"choice",p:"I ___ what you mean.",o:["understand","am understanding"],a:0,x:"*understand* non prende -ing."},
    {t:"order",p:"Di solito sono in ufficio il lunedì.",w:["I'm","usually","in","the","office","on","Mondays."],x:"Con BE l'avverbio va dopo."},
    {t:"fix",p:"She never is late for the stand-up.",a:["She is never late for the stand-up."],x:"Con BE l'avverbio va dopo: *is never*."},
    {t:"order",p:"Questa settimana testiamo il nuovo onboarding.",w:["We're","testing","the","new","onboarding","this","week."],x:"BE + -ing per il periodo in corso."}]},
  { id:"m1l5", h:"Sfida: presentati al tutor", min:10, final:true,
    tip:"Sei frasi da costruire da zero, in inglese, senza aiuti. Più accettiamo le varianti corrette: se la tua è giusta ma diversa, toccala come giusta.",
    q:[
    {t:"trans",p:"La mia manager scrive le specifiche.",a:["My manager writes the specs.","My manager writes the specifications."]},
    {t:"trans",p:"Usi Figma o Sketch?",a:["Do you use Figma or Sketch?"]},
    {t:"trans",p:"Il prototipo non è pronto.",a:["The prototype isn't ready.","The prototype isn't ready yet."]},
    {t:"trans",p:"Di solito testo su mobile.",a:["I usually test on mobile.","Usually I test on mobile."]},
    {t:"trans",p:"Quanto spesso fate interviste con gli utenti?",a:["How often do you do user interviews?","How often do you run user interviews?","How often do you interview users?"]},
    {t:"trans",p:"Stiamo lavorando a un nuovo design system.",a:["We're working on a new design system."]},
    {t:"trans",p:"Sono UX/UI designer e lavoro a Firenze.",a:["I'm a UX/UI designer and I work in Florence.","I'm a UX and UI designer and I work in Florence.","I'm a UX/UI designer and I'm based in Florence.","I'm a UX/UI designer based in Florence."]},
    {t:"trans",p:"Il mio team rilascia ogni due settimane.",a:["My team ships every two weeks.","My team releases every two weeks.","My team ships a release every two weeks.","My team deploys every two weeks."]},
    {t:"trans",p:"Fate test di usabilità?",a:["Do you run usability tests?","Do you do usability tests?","Do you do usability testing?","Do you run usability testing?"]},
    {t:"trans",p:"Il bottone non funziona su Android.",a:["The button doesn't work on Android."]},
    {t:"trans",p:"In questo sprint sto ridisegnando il checkout.",a:["This sprint I'm redesigning the checkout.","In this sprint I'm redesigning the checkout.","I'm redesigning the checkout this sprint.","I'm redesigning the checkout in this sprint."]},
    {t:"trans",p:"Cosa ne pensi del nuovo flusso?",a:["What do you think about the new flow?","What do you think of the new flow?"]}]} ] },

/* ---------------- MODULO 2 ---------------- */
{ id:"m2", color:"indigo", icon:"folder", title:"Portfolio e case study", tag:"Passato", sub:"Raccontare un progetto: cosa avete fatto, cosa è successo, cosa hai imparato.",
  lessons:[
  { id:"m2l1", h:"Passato: -ED o irregolare", min:10,
    tip:"Per raccontare un progetto finito: verbo + **-ED**. I verbi più usati in un case study sono irregolari: impara la seconda colonna come parole nuove.",
    formula:[["Chi","blue"],["verbo-ed / irregolare","orange"],["Cosa","green"],["Quando","indigo"]],
    rows:[["We","redesigned","the app","in 2024."],["I","ran","five interviews","last week."],["The team","built","a prototype","in two days."]],
    extra:"Irregolari da case study: *make → made · build → built · run → ran · lead → led · find → found · choose → chose · write → wrote · send → sent · take → took · think → thought · be → was / were*.",
    trap:["We finded three problems.","We found three problems."],
    q:[
    {t:"choice",p:"We ___ three big problems in the checkout.",o:["finded","found","find"],a:1,x:"*find → found*: irregolare."},
    {t:"gap",p:"We ___ (launch) the new version in March.",a:["launched"],x:"Regolare: +ed."},
    {t:"gap",p:"I ___ (lead) the research phase.",a:["led"],x:"*lead → led*."},
    {t:"gap",p:"We ___ (run) eight usability tests.",a:["ran"],x:"*run → ran*."},
    {t:"gap",p:"The users ___ (be) confused by the icons.",a:["were"],x:"Plurale → *were*."},
    {t:"gap",p:"The old checkout ___ (be) too long.",a:["was"],x:"Singolare → *was*."},
    {t:"match",p:"Abbina il verbo al suo passato.",pairs:[["make","made"],["build","built"],["choose","chose"],["think","thought"],["write","wrote"]],x:"Colonna 2 dei verbi irregolari."},
    {t:"fix",p:"We choosed a darker palette.",a:["We chose a darker palette."],x:"*choose → chose*."}]},
  { id:"m2l2", h:"Il trick di DID", min:8,
    tip:"Domande e negative al passato: **did / didn't** + verbo nudo. Il passato se lo prende *did*: lo usi **una volta sola**.",
    formula:[["Chi","blue"],["didn't","purple"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["We","didn't","change","the logo."],["The client","didn't","approve","the first draft."],["Users","didn't","find","the filter."]],
    extra:"Domanda: *did* in testa, o dopo la parola Q → *==Did you test== it on mobile? Why ==did== users ==leave==?*",
    trap:["Did you tested it?","Did you test it?"],
    q:[
    {t:"choice",p:"Did you ___ it on mobile?",o:["test","tested","testing"],a:0,x:"Dopo *did* il verbo è nudo."},
    {t:"gap",p:"We ___ (not / change) the logo.",a:["didn't change","did not change"],x:"*didn't* + verbo nudo."},
    {t:"gap",p:"The client ___ (not / approve) the first draft.",a:["didn't approve","did not approve"],x:"*didn't* + verbo nudo."},
    {t:"order",p:"Perché gli utenti hanno lasciato il carrello?",w:["Why","did","users","leave","the","cart?"],x:"Q-A-S-V con *did*."},
    {t:"order",p:"Hai parlato con gli utenti?",w:["Did","you","talk","to","the","users?"],x:"*Did* → chi → verbo nudo."},
    {t:"choice",p:"Qual è corretta?",o:["When did you started the project?","When did you start the project?","When you started the project?"],a:1,x:"*did* + verbo nudo."},
    {t:"fix",p:"We didn't found any bugs.",a:["We didn't find any bugs."],x:"Il passato una volta sola: *didn't find*."},
    {t:"fix",p:"Why users left the checkout page?",a:["Why did users leave the checkout page?"],x:"Domanda al passato: *did* + verbo nudo."}]},
  { id:"m2l3", h:"Mentre succedeva: WAS + ING", min:10,
    tip:"Azione **in corso nel passato**, spesso interrotta: **was / were + -ing**. L'azione breve che interrompe va al passato semplice. Bonus: *I was wondering if…* è la richiesta più gentile che esista.",
    formula:[["Chi","blue"],["was / were","purple"],["verbo-ing","pink"],["when + passato","indigo"]],
    rows:[["I","was","presenting","when the Wi-Fi died."],["We","were","testing","when the app crashed."],["I","was","wondering","if you could review it."]],
    extra:"Con *while* metti due azioni lunghe in parallelo: *I ==was designing== while she ==was writing== the copy.*",
    trap:["I was present when the client called.","I was presenting when the client called."],
    q:[
    {t:"gap",p:"We ___ (test) the app when it crashed.",a:["were testing"],x:"Azione in corso: *were* + -ing."},
    {t:"gap",p:"I ___ (present) when the Wi-Fi died.",a:["was presenting"],x:"*I* → *was* + -ing."},
    {t:"choice",p:"She was sketching when the PM ___.",o:["arrived","was arriving"],a:0,x:"L'azione breve che interrompe va al passato semplice."},
    {t:"choice",p:"What ___ you doing at 6 pm yesterday?",o:["were","did","was"],a:0,x:"*you* → *were* + -ing."},
    {t:"gap",p:"They ___ (not / listen) during the demo.",a:["weren't listening","were not listening"],x:"Negativa: *weren't* + -ing."},
    {t:"order",p:"Mi chiedevo se potessi rivedere il file.",w:["I","was","wondering","if","you","could","review","the","file."],x:"Formula cortese: *I was wondering if…*"},
    {t:"order",p:"Progettavo mentre lei scriveva i testi.",w:["I","was","designing","while","she","was","writing","the","copy."],x:"*while* + due azioni lunghe."},
    {t:"fix",p:"I was work on the wireframes when you called.",a:["I was working on the wireframes when you called."],x:"Dopo *was* serve il verbo in -ing."}]},
  { id:"m2l4", h:"Esperienza: HAVE + participio", min:10,
    tip:"Esperienza senza data, o cosa iniziata nel passato e ancora vera: **have / has + participio**. Con una data precisa (*in 2020, last year*) torni al passato semplice.",
    formula:[["Chi","blue"],["have / has","purple"],["participio","orange"],["Resto","green"],["for / since","indigo"]],
    rows:[["I","'ve","worked","as a designer","since 2013."],["We","'ve","shipped","three apps","this year."],["She","has","led","the team","for two years."]],
    extra:"**for** + durata (*for 10 years*), **since** + punto di partenza (*since 2013*). *Have you ever…?* per le esperienze. La domanda del tutor: *How long ==have you been== a designer?*",
    trap:["I work as a designer since 2013.","I've worked as a designer since 2013."],
    q:[
    {t:"gap",p:"I ___ (work) as a designer since 2013.",a:["have worked","'ve worked","have been working","'ve been working"],x:"*since* + ancora vero → *have worked*."},
    {t:"choice",p:"I've been a designer ___ 12 years.",o:["for","since"],a:0,x:"*for* + durata."},
    {t:"choice",p:"We've used Figma ___ 2019.",o:["for","since"],a:1,x:"*since* + anno di inizio."},
    {t:"choice",p:"We ___ the app in 2022.",o:["launched","have launched"],a:0,x:"Data precisa → passato semplice."},
    {t:"choice",p:"___ you ever ___ a design system?",o:["Have … built","Did … built","Have … build"],a:0,x:"*Have you ever* + participio."},
    {t:"gap",p:"We haven't finished the prototype ___. (ancora)",a:["yet"],x:"*yet* va in fondo nelle negative e nelle domande."},
    {t:"gap",p:"She ___ (lead) the team for two years.",a:["has led","'s led"],x:"*she* → *has* + *led*."},
    {t:"fix",p:"I teach UX design since 2021.",a:["I've taught UX design since 2021.","I've been teaching UX design since 2021."],x:"Con *since* l'italiano usa il presente, l'inglese no."}]},
  { id:"m2l5", h:"Sfida: racconta un case study", min:12, final:true,
    tip:"Prima rimetti in ordine un case study (come i *jumbled paragraphs* della guida), poi traduci cinque frasi chiave da portfolio.",
    q:[
    {t:"trans",p:"Ieri ho mandato il file al cliente.",a:["Yesterday I sent the file to the client.","I sent the file to the client yesterday.","Yesterday I sent the client the file.","I sent the client the file yesterday."]},
    {t:"trans",p:"Abbiamo trovato tre problemi nel checkout.",a:["We found three problems in the checkout.","We found three issues in the checkout.","We found 3 problems in the checkout."]},
    {t:"trans",p:"Gli utenti erano confusi dalle icone.",a:["The users were confused by the icons.","Users were confused by the icons."]},
    {t:"trans",p:"Non abbiamo ancora finito il prototipo.",a:["We haven't finished the prototype yet."]},
    {t:"trans",p:"Hai mai costruito un design system?",a:["Have you ever built a design system?"]},
    {t:"trans",p:"Stavamo testando l'app quando si è bloccata.",a:["We were testing the app when it crashed.","We were testing the app when it froze."]},
    {t:"order",block:true,p:"Metti in ordine il case study: problema → ricerca → soluzione → risultato.",w:["Users abandoned the checkout at step 3.","We ran five interviews and found the main pain point.","We cut the form from 12 fields to 5.","The conversion rate went up by 18%."],x:"Struttura classica: *problem → research → solution → results*."},
    {t:"trans",p:"Abbiamo ridisegnato l'app nel 2024.",a:["We redesigned the app in 2024."]},
    {t:"trans",p:"Non abbiamo cambiato il logo.",a:["We didn't change the logo."]},
    {t:"trans",p:"Hai testato il prototipo con gli utenti?",a:["Did you test the prototype with users?","Did you test the prototype with the users?","Have you tested the prototype with users?","Have you tested the prototype with the users?"]},
    {t:"trans",p:"Stavo presentando quando il cliente ha chiamato.",a:["I was presenting when the client called.","I was presenting when the customer called."]},
    {t:"trans",p:"Lavoro come designer dal 2013.",a:["I've worked as a designer since 2013.","I've been a designer since 2013.","I've been working as a designer since 2013."]}]} ] },

/* ---------------- MODULO 3 ---------------- */
{ id:"m3", color:"purple", icon:"flag", title:"Roadmap e piani", tag:"Futuro", sub:"Piani, scadenze, ipotesi e proposte per il prossimo sprint.",
  lessons:[
  { id:"m3l1", h:"WILL decide, GOING TO pianifica", min:8,
    tip:"Decidi adesso o prometti → **will**. È già un piano → **going to**. È in calendario con un orario → **BE + -ing**.",
    formula:[["Chi","blue"],["will / 'm going to","purple"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["I","'ll","send","you the Figma link."],["We","'re going to","test","the prototype next week."],["It","won't","take","long."]],
    extra:"In calendario: *We==’re presenting== to the client on Friday at 3.* Dopo *will* niente *to*: *I'll ==send==*, mai *I'll to send*.",
    trap:["I will to send it tomorrow.","I'll send it tomorrow."],
    q:[
    {t:"choice",p:"OK, I ___ send you the link after the call.",o:["will","am going to"],a:0,x:"Decisione presa adesso → *will*."},
    {t:"choice",p:"We decided last month: we ___ move to a new design system.",o:["will","are going to"],a:1,x:"Piano già deciso → *going to*."},
    {t:"choice",p:"We ___ to the client on Friday at 3. (in calendario)",o:["present","are presenting","will presenting"],a:1,x:"Appuntamento → BE + -ing."},
    {t:"gap",p:"Don't worry, it ___ take long. (negativa)",a:["won't","will not"],x:"*will not* → *won't*."},
    {t:"order",p:"Testeremo il prototipo la settimana prossima.",w:["We","are","going","to","test","the","prototype","next","week."],x:"Piano: *are going to* + verbo nudo."},
    {t:"fix",p:"I will to update the file tonight.",a:["I'll update the file tonight."],x:"Dopo *will* niente *to*."},
    {t:"trans",p:"Ti mando il link di Figma dopo la call.",a:["I'll send you the Figma link after the call.","I'll send the Figma link to you after the call."],x:"Decisione presa ora → *will*."},
    {t:"order",p:"Lanceremo la beta tra due settimane.",w:["We're","going","to","launch","the","beta","in","two","weeks."],x:"Piano: *going to*; *tra due settimane* = *in two weeks*."}]},
  { id:"m3l2", h:"Entro la scadenza: WILL HAVE", min:8,
    tip:"Una cosa che sarà **finita entro** una scadenza: **will have + participio**. Una cosa che sarà **in corso** in un momento futuro: **will be + -ing**. Perfetti per roadmap e stime.",
    formula:[["By + scadenza","indigo"],["Chi","blue"],["will have","purple"],["participio","orange"],["Resto","green"]],
    rows:[["By Q3,","we","'ll have","launched","the design system."],["By Friday,","I","'ll have","finished","the wireframes."],["This time tomorrow,","I","'ll be","presenting","to the board."]],
    extra:"Parole spia: *by Friday, by the end of the sprint, by Q3* → *will have*. *This time next week, at 10 tomorrow* → *will be + -ing*.",
    trap:["By Q3 we will have launch the app.","By Q3 we'll have launched the app."],
    q:[
    {t:"choice",p:"By the end of the sprint we ___ the new flow.",o:["will have tested","will testing","have tested"],a:0,x:"*by* + scadenza → *will have* + participio."},
    {t:"gap",p:"By Friday, I ___ (finish) the wireframes.",a:["will have finished","'ll have finished"],x:"*will have* + *finished*."},
    {t:"gap",p:"This time tomorrow, I ___ (present) to the board.",a:["will be presenting","'ll be presenting"],x:"In corso in quel momento → *will be* + -ing."},
    {t:"choice",p:"By Q3 the team ___ 40 components.",o:["will have built","will be build","builds"],a:0,x:"*build → built*."},
    {t:"choice",p:"Don't call me at 10: I ___ a user interview.",o:["'ll be running","'ll have run","run"],a:0,x:"Alle 10 sarà in corso → *will be running*."},
    {t:"order",p:"Entro lunedì avremo sistemato tutti i bug.",w:["By","Monday","we","will","have","fixed","all","the","bugs."],x:"*By* + *will have fixed*."},
    {t:"fix",p:"By Q3 we will have launch the app.",a:["By Q3 we'll have launched the app."],x:"Dopo *have* serve il participio: *launched*."}]},
  { id:"m3l3", h:"IF e WHEN: dopo, presente", min:8,
    tip:"Dopo **if**, **when**, **as soon as**, **before**, **after** usi il **presente**, anche se parli di futuro. Il *will* va nell'altra metà della frase.",
    formula:[["If / When","indigo"],["presente","orange"],["→","gray"],["will + verbo","purple"]],
    rows:[["If","the test fails,","→","we'll iterate."],["When","I finish,","→","I'll send it."],["As soon as","the client replies,","→","we'll start."]],
    extra:"L'ordine si può invertire, la regola no: *We'll start ==as soon as== the client ==replies==.* Ipotesi poco probabile: *If we ==had== more time, we ==would== test more.*",
    trap:["When I will finish, I call you.","When I finish, I'll call you."],
    q:[
    {t:"choice",p:"I'll call you when I ___.",o:["finish","will finish"],a:0,x:"Dopo *when* → presente."},
    {t:"gap",p:"If the test ___ (fail), we'll iterate.",a:["fails"],x:"Dopo *if* → presente (con la S: *the test* = it)."},
    {t:"gap",p:"If users like it, we ___ (roll) it out to everyone.",a:["will roll","'ll roll"],x:"L'altra metà vuole *will*."},
    {t:"choice",p:"We'll start as soon as the client ___.",o:["replies","will reply","reply"],a:0,x:"*as soon as* + presente; *the client* → *replies*."},
    {t:"choice",p:"If we had more budget, we ___ hire a researcher.",o:["would","will"],a:0,x:"Ipotesi poco probabile → *had … would*."},
    {t:"order",p:"Se approvi oggi, iniziamo lunedì.",w:["If","you","approve","today,","we'll","start","on","Monday."],x:"*If* + presente, poi *will*."},
    {t:"fix",p:"If the test will fail, we iterate.",a:["If the test fails, we'll iterate."],x:"Niente *will* dopo *if*; il *will* va nell'altra metà."}]},
  { id:"m3l4", h:"Proporre: should, could, might", min:8,
    tip:"Dopo **can, could, should, might, must** c'è sempre il **verbo nudo**: niente *to*, niente *S*, niente *do*. Scegli il modale in base a quanto sei sicuro.",
    formula:[["Chi","blue"],["should / could / might","purple"],["Verbo nudo","orange"],["Resto","green"]],
    rows:[["We","should","simplify","the checkout."],["We","could","try","a bottom sheet."],["It","might","confuse","new users."]],
    extra:"Scala di certezza: *will* (sicuro) → *should* (probabile) → *may / might / could* (forse). Obbligo esterno: *We ==have to== follow the brand guidelines*. Non serve: *You ==don't have to== join*.",
    trap:["We should to test it.","We should test it."],
    q:[
    {t:"choice",p:"We should ___ it with real users.",o:["test","to test","testing"],a:0,x:"Modale + verbo nudo."},
    {t:"choice",p:"Consiglio: “Dovremmo semplificare il form”",o:["We should simplify the form.","We must to simplify the form.","We would simplify the form."],a:0,x:"Consiglio → *should*."},
    {t:"choice",p:"Forse: “Potrebbe confondere i nuovi utenti”",o:["It might confuse new users.","It must confuse new users.","It mights confuse new users."],a:0,x:"Possibilità → *might*, senza S."},
    {t:"choice",p:"You ___ join the call: it's optional.",o:["mustn't","don't have to"],a:1,x:"Non necessario → *don't have to*. *Mustn't* = è vietato."},
    {t:"choice",p:"Qual è corretta?",o:["Do you can share your screen?","Can you share your screen?","Can you to share your screen?"],a:1,x:"Niente *do*, niente *to*."},
    {t:"order",p:"Potremmo provare un bottom sheet.",w:["We","could","try","a","bottom","sheet."],x:"*could* + verbo nudo."},
    {t:"fix",p:"She cans join the review.",a:["She can join the review."],x:"I modali non prendono la S."},
    {t:"trans",p:"Qui potremmo provare un bottom sheet.",a:["We could try a bottom sheet here.","Here we could try a bottom sheet."],x:"*could* + verbo nudo."}]},
  { id:"m3l5", h:"Sfida: presenta la roadmap", min:10, final:true,
    tip:"Sei frasi da roadmap: piani, scadenze, condizioni e proposte.",
    q:[
    {t:"trans",p:"Lunedì presentiamo al cliente. (in calendario)",a:["We're presenting to the client on Monday.","On Monday we're presenting to the client."]},
    {t:"trans",p:"Quando finisco, ti chiamo.",a:["When I finish, I'll call you.","I'll call you when I finish."]},
    {t:"trans",p:"Non ci vorrà molto.",a:["It won't take long."]},
    {t:"trans",p:"Potremmo provare un bottom sheet.",a:["We could try a bottom sheet."]},
    {t:"trans",p:"Non devi partecipare: è facoltativo.",a:["You don't have to join: it's optional.","You don't have to come: it's optional.","You don't have to attend: it's optional."]},
    {t:"trans",p:"Entro il Q3 avremo lanciato il nuovo sito.",a:["By Q3 we'll have launched the new website.","By Q3 we'll have launched the new site.","We'll have launched the new website by Q3."]},
    {t:"trans",p:"Ti mando il link dopo la call.",a:["I'll send you the link after the call.","I'll send the link to you after the call."]},
    {t:"trans",p:"Testeremo il prototipo la settimana prossima.",a:["We're going to test the prototype next week.","We'll test the prototype next week.","We're testing the prototype next week."]},
    {t:"trans",p:"Entro venerdì avrò finito i wireframe.",a:["By Friday I'll have finished the wireframes.","I'll have finished the wireframes by Friday."]},
    {t:"trans",p:"Se il test fallisce, iteriamo.",a:["If the test fails, we'll iterate.","If the test fails, we iterate."]},
    {t:"trans",p:"Dovremmo semplificare il checkout.",a:["We should simplify the checkout."]},
    {t:"trans",p:"Potrebbe confondere gli utenti.",a:["It might confuse users.","It might confuse the users.","It could confuse users.","It could confuse the users.","It may confuse users.","It may confuse the users."]}]} ] },
